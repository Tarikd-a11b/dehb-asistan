# FocusAid — Render servis tanımı (Blueprint)
#
# ⚠️ CANLI SERVİS ŞU AN BU DOSYADAN YÖNETİLMİYOR.
# `dehb-asistan` servisi Render panelinden elle oluşturuldu, Blueprint'e bağlı değil.
# Dolayısıyla buradaki `autoDeploy` dahil hiçbir ayar canlıya kendiliğinden geçmez —
# gerçek ayarlar Render Dashboard → dehb-asistan → Settings altında.
#
# Deploy: `main`'e push → Render otomatik deploy eder (2026-08-27'de ölçüldü, ~38 sn).
# Bir dönem bu çalışmıyordu; sebep ayar değil, Render GitHub App'inin repo erişiminin
# kesilmiş olmasıydı. Tekrarlarsa: github.com/settings/installations → Render →
# repository access. Geçici çözüm: Dashboard → dehb-asistan → Manual Deploy →
# "Deploy latest commit" (~30 sn). Doğrulama yerel dosyaya değil canlıya bakarak:
#   curl -s https://dehb-asistan.onrender.com/index.html | grep -c <yeni_fonksiyon_adı>
#
# Bu dosya iki işe yarıyor: (1) servisin nasıl ayakta durduğunu ve hangi ortam
# değişkenlerine ihtiyaç duyduğunu belgeliyor, (2) servis bir gün Blueprint'ten
# yeniden kurulmak istenirse hazır duruyor.

services:
  - type: web
    name: dehb-asistan          # canlı servisin adı
    runtime: python             # `env:` alanı Render tarafından kullanımdan kaldırıldı
    plan: free                  # ücretsiz plan hareketsizlikte uyur; ilk istek 50 sn'ye kadar gecikebilir
    region: virginia
    branch: main
    autoDeploy: true            # yalnızca servis Blueprint'e bağlanırsa geçerli olur (yukarıdaki nota bak)
    buildCommand: pip install -r requirements.txt   # tek bağımlılık: cryptography (token şifreleme)
    startCommand: python serve.py                   # PORT'u Render veriyor, serve.py onu okuyor

    envVars:
      # Hiçbiri repoya yazılmaz: sync:false = "değeri panelden elle gir".
      # serve.py bunları config.js'e enjekte eder ya da sunucu tarafında kullanır.

      # — Tarayıcıya gönderilenler (gizli değil, zaten sayfa kaynağında görünür) —
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false

      # — YALNIZCA sunucu tarafı; tarayıcıya HİÇ gönderilmez —
      # Google token'ının sessizce yenilenmesi için gerekli (/api/google/refresh).
      # Tanımlı değilse uygulama çalışır, sadece otomatik yenileme devre dışı kalır.
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Refresh token'ı veritabanında şifreleyen anahtar (base64, 32 bayt). Üret:
      #   python -c "import os,base64;print(base64.b64encode(os.urandom(32)).decode())"
      # Tanımsızsa yeni girişlerde refresh token SAKLANMAZ (düz metin yazılmaz).
      # ⚠️ DEĞİŞTİRİRSEN saklı token'lar çözülemez: kullanıcılar bir kez yeniden
      # giriş yapıp izin verir. Yedeğini parola yöneticisinde tut.
      - key: GOOGLE_TOKEN_KEY
        sync: false
      # n8n'in gerçek webhook adresleri. Tanımlı değilse serve.py sessizce
      # localhost:5678 varsayılanına düşer ve Parçalayıcı canlıda çalışmaz.
      - key: N8N_WEBHOOK
        sync: false
      - key: N8N_ANALYZE_WEBHOOK
        sync: false
      # n8n'deki Header Auth credential'ının değeriyle BİREBİR aynı olmalı;
      # uyuşmazsa webhook 403 döner ve Parçalayıcı kırılır.
      - key: N8N_SECRET
        sync: false

      # Canlı çalışma odaları (Daily.co). Anahtar yoksa canlı odalar "kapalı"
      # görünür, uygulamanın geri kalanı etkilenmez. DAILY_DOMAIN: 'ornek' ya da 'ornek.daily.co'.
      - key: DAILY_API_KEY
        sync: false
      - key: DAILY_DOMAIN
        sync: false
      # Jitsi oda adlarını her hafta değiştiren sır (/api/rooms/jitsi). Üret:
      #   python -c "import secrets;print(secrets.token_urlsafe(32))"
      # Tanımsızsa eski sabit oda adları kullanılır (odalar kapanmaz).
      - key: JITSI_ODA_SIRRI
        sync: false
      # Kişi başı günlük oda dakikası (varsayılan 240). Ücretsiz kotayı korur.
      - key: GUNLUK_LIMIT_DK
        value: "240"

      - key: TIMEZONE
        value: Europe/Istanbul
