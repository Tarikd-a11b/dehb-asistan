  { icon: '🧠', bg: 'bg-violet-100',  text: 'text-violet-600',  bar: 'bg-violet-500'  },
  { icon: '✨', bg: 'bg-emerald-100', text: 'text-emerald-600', bar: 'bg-emerald-500' },
  { icon: '🔥', bg: 'bg-orange-100',  text: 'text-orange-600',  bar: 'bg-orange-500'  },
  { icon: '🌱', bg: 'bg-teal-100',    text: 'text-teal-600',    bar: 'bg-teal-500'    }
];

async function loadProjectsList() {
  const grid = document.getElementById('projects-grid');
  const empty = document.getElementById('projects-empty');
  const stats = document.getElementById('projects-stats');
  if (!grid || !currentUser) return;
  try {
    const { data, error } = await window.supabaseClient
      .from('tasks')
      .select('project_title, day, completed')
      .eq('user_id', currentUser.id)
      .not('project_title', 'is', null);
    if (error) throw error;

    const groups = {};
    for (const t of (data || [])) {
      const key = (t.project_title || '').trim();
      if (!key) continue;
      if (!groups[key]) groups[key] = { total: 0, done: 0, days: new Set() };
      groups[key].total++;
      if (t.completed) groups[key].done++;
      if (t.day) groups[key].days.add(t.day);
    }
    const names = Object.keys(groups).sort();
    if (names.length === 0) {
      grid.innerHTML = '';
      grid.classList.add('hidden');
      stats?.classList.add('hidden');
      empty?.classList.remove('hidden');
      return;
    }
    grid.classList.remove('hidden');
    empty?.classList.add('hidden');

    // Özet istatistik satırı (SMART referansı): toplam proje/görev/tamamlanan
    // + saf CSS conic-gradient ile dairesel genel ilerleme (CuteHR referansı).
    if (stats) {
      const toplamGorev = names.reduce((s, n) => s + groups[n].total, 0);
      const toplamTamam = names.reduce((s, n) => s + groups[n].done, 0);
      const genelYuzde = toplamGorev > 0 ? Math.round((toplamTamam / toplamGorev) * 100) : 0;
      stats.classList.remove('hidden');
      stats.innerHTML = `
        <div class="glass-card p-5 bg-white/90 shadow-lg flex items-center gap-4">
          <div class="w-12 h-12 rounded-2xl bg-indigo-100 text-indigo-600 flex items-center justify-center text-2xl shrink-0">📁</div>
          <div class="min-w-0"><p class="text-2xl font-extrabold text-slate-900 tabular-nums">${names.length}</p><p class="text-xs font-bold text-slate-400 uppercase tracking-wide">Proje</p></div>
        </div>
        <div class="glass-card p-5 bg-white/90 shadow-lg flex items-center gap-4">
          <div class="w-12 h-12 rounded-2xl bg-sky-100 text-sky-600 flex items-center justify-center text-2xl shrink-0">🧩</div>
          <div class="min-w-0"><p class="text-2xl font-extrabold text-slate-900 tabular-nums">${toplamGorev}</p><p class="text-xs font-bold text-slate-400 uppercase tracking-wide">Görev</p></div>
        </div>
        <div class="glass-card p-5 bg-white/90 shadow-lg flex items-center gap-4">
          <div class="w-12 h-12 rounded-2xl bg-emerald-100 text-emerald-600 flex items-center justify-center text-2xl shrink-0">✅</div>
          <div class="min-w-0"><p class="text-2xl font-extrabold text-slate-900 tabular-nums">${toplamTamam}</p><p class="text-xs font-bold text-slate-400 uppercase tracking-wide">Tamamlanan</p></div>
        </div>
        <div class="glass-card p-5 bg-white/90 shadow-lg flex items-center gap-4">
          <div class="relative w-12 h-12 shrink-0 rounded-full" style="background:conic-gradient(#6366f1 ${genelYuzde}%, #e2e8f0 ${genelYuzde}% 100%)">
            <div class="absolute inset-[3px] bg-white rounded-full flex items-center justify-center text-[10px] font-black text-indigo-600">${genelYuzde}%</div>
          </div>
          <div class="min-w-0"><p class="text-2xl font-extrabold text-slate-900 tabular-nums">${genelYuzde}%</p><p class="text-xs font-bold text-slate-400 uppercase tracking-wide">Genel İlerleme</p></div>
        </div>`;
    }

    grid.innerHTML = names.map((name, i) => {
      const g = groups[name];
      const days = [...g.days].sort();
      const aralik = days.length ? (days[0] === days[days.length - 1] ? days[0] : `${days[0]} → ${days[days.length - 1]}`) : '';
      const yuzde = g.total > 0 ? Math.round((g.done / g.total) * 100) : 0;
      const tema = PROJE_TEMALARI[i % PROJE_TEMALARI.length];
      return `
        <div class="glass-card p-6 bg-white/90 shadow-lg hover:shadow-xl transition-all">
          <div class="flex items-start justify-between mb-4">
            <div class="w-12 h-12 rounded-2xl ${tema.bg} ${tema.text} flex items-center justify-center text-2xl">${tema.icon}</div>
            <button data-proje="${escapeHtml(name)}" onclick="projeSilTiklandi(this)" class="text-slate-300 hover:text-red-500 transition-colors text-lg leading-none" title="Projeyi sil">🗑️</button>
          </div>
          <h3 class="font-bold text-slate-900 text-lg mb-1 truncate" title="${escapeHtml(name)}">${escapeHtml(name)}</h3>
          <p class="text-xs text-slate-400 mb-4">${escapeHtml(aralik)}</p>
          <div class="flex justify-between items-center text-xs font-bold text-slate-500 mb-1.5">
            <span>İlerleme</span><span class="${tema.text} tabular-nums">${g.done}/${g.total}</span>
          </div>
          <div class="h-2 bg-slate-200 rounded-full overflow-hidden">
            <div class="h-full ${tema.bar} rounded-full transition-all duration-500" style="width:${yuzde}%"></div>
          </div>
        </div>`;
    }).join('');
  } catch (e) {
    console.error('[Projeler] yüklenemedi:', e);
    grid.innerHTML = '<div class="text-red-400 py-10 col-span-full text-center">❌ Projeler yüklenemedi</div>';
  }
}

function projeSilTiklandi(btn) {
  const proje = btn.dataset.proje;
  if (!proje) return;
  showConfirm(
    'Projeyi sil?',
    `"${proje}" projesindeki tüm görevler (geçmiş dahil, tüm günler) kalıcı olarak silinecek. Bu işlem geri alınamaz.`,
    () => projeSilUygula(proje),
    { onayEtiketi: 'Evet, Sil', yikici: true }
  );
}

async function projeSilUygula(proje) {
  if (!currentUser) return;
  try {
    const { data: rows, error: fetchErr } = await window.supabaseClient
      .from('tasks')
      .select('id, calendar_event_id')
      .eq('user_id', currentUser.id)
      .eq('project_title', proje);
    if (fetchErr) throw fetchErr;

    // Bağlı Google Calendar etkinliklerini de sil, yoksa Supabase satırı gitse
    // bile ham GCal etkinliği takvimde hayalet görev olarak kalır.
    if (AppState.gapiReady && AppState.googleAccessToken) {
      gapi.client.setToken({ access_token: AppState.googleAccessToken });
      for (const row of (rows || [])) {
        if (!row.calendar_event_id) continue;
        try { await gapi.client.calendar.events.delete({ calendarId: 'primary', eventId: row.calendar_event_id }); }
        catch (e) { console.warn('[Proje Sil] Takvim etkinliği silinemedi:', row.calendar_event_id, e); }
      }
    }

    const { error: delErr } = await window.supabaseClient
      .from('tasks')
      .delete()
      .eq('user_id', currentUser.id)
      .eq('project_title', proje);
    if (delErr) throw delErr;

    showToast(`🗑️ "${proje}" silindi`, 'success');
    await loadProjectsList();
    AppState.calendar?.refetchEvents();
    if (typeof TodayState !== 'undefined') TodayState.loaded = false;
    if (typeof initToday === 'function' && document.getElementById('today-list')) await initToday();
  } catch (e) {
    console.error('[Proje Sil] hata:', e);
    showToast('❌ Silinemedi: ' + (e.message || 'bilinmeyen hata'), 'error');
    await loadProjectsList();
  }
}

// ── SUPABASE PROFİL İŞLEMLERİ ────────────────────────────────────────────────
async function loadProfileFromSupabase() {
  if (!currentUser) return;
  const { data, error } = await sb
    .from('profiles')
    .select('*')
    .eq('id', currentUser.id)
    .single();

  if (error || !data) {
    // Sessizce donmek 2026-08-24'te bir seferi ciddi vakit kaybettirdi: canli
    // tabloda `id` kolonu yokken profil hic yuklenmiyordu ama hicbir iz yoktu.
    if (error) console.warn('[Profil] Supabase okunamadi:', error.code, error.message);
    return;
  }

  // Supabase satiri → userProfile (donusum profile-logic.js'te, testli).
  userProfile = rowToProfile(data);
  localStorage.setItem('focusaid_profile', JSON.stringify(userProfile));
  // Bu tarayıcıda daha önce hiç tema seçilmemişse (yeni cihaz/tarayıcı), hesaba
  // kayıtlı ışık hassasiyetinden varsayılan temayı öner — açıkça seçilmiş bir
  // tercihin üzerine asla yazmaz.
  if (localStorage.getItem('focusaid_theme') === null) applyTheme(themeIsDark(userProfile.lightSensitivity));
  syncThemeToggleUI();
}

async function saveProfileToSupabase(profile) {
  if (!currentUser) return;
  // profileToRow her kolonu doldurur (undefined birakmaz): JSON.stringify
  // undefined alani duserir, upsert o kolonu hic gondermez ve eski deger
  // sessizce yerinde kalirdi.
  const { error } = await sb.from('profiles')
    .upsert(profileToRow(profile, { id: currentUser.id, email: currentUser.email }),
            { onConflict: 'id' });
  // Hatayi yutma — saveProfile bunu yakalayip kullaniciya "sunucuya
  // yazilamadi" diyecek. Eskiden sessizdi, kullanici kaydettim saniyordu.
  if (error) throw new Error(`${error.code}: ${error.message}`);
}

// ── CONFIG ──
const CONFIG = FOCUSAID_CONFIG;

// calendarHeight: takvime EN SON uygulanan height. datesSet bunu karsilastirip
// gereksiz setOption/re-render'i atliyor (bkz. heightForView).
const AppState = { calendar: null, calendarHeight: null, tokenClient: null, gapiReady: false, gisReady: false, googleAccessToken: null, supabaseToken: null };
const GOOGLE_TOKEN_STORAGE_KEY = 'focusaid_google_token';

/**
 * Takvim butonunun ÜÇ durumu var. Eskiden yalnızca iki tane vardı ('Bağla' ve
 * '✓ Bağlandı') ve buton açılışta 'Google Takvimi Bağla' yazıyordu — oysa otomatik
 * bağlanma ~7 saniye sürüyor (ölçüldü: gapi yüklenmesi + Google'a doğrulama isteği,
 * yenileme yolunda ayrıca Supabase sorgusu + /api/google/refresh). Kullanıcı o 7
 * saniyede yan panele bakıp takvimin bağlanmadığını sanıyordu. Artık 'bağlanıyor'
 * durumuyla açılıyor ve gerçekten başarısız olursa 'Bağla'ya düşüyor.
 */
function takvimButonDurumu(durum) {
  const btn = document.getElementById('auth-btn');
  if (!btn) return;
  btn.classList.remove('text-emerald-600', 'border-emerald-200');
  if (durum === 'bagli') {
    btn.textContent = '✓ Takvim Bağlandı';
    btn.classList.add('text-emerald-600', 'border-emerald-200');
    btn.disabled = true;
  } else if (durum === 'baglaniyor') {
    btn.textContent = 'Takvim bağlanıyor…';
    btn.disabled = true;
  } else {
    btn.textContent = 'Google Takvimi Bağla';
    btn.disabled = false;
  }
}

/**
 * Otomatik bağlanma İKİ yoldan denenir ve hangisinin kazanacağı önceden belli
 * değil: (a) önbellekteki token / refresh token ile yenileme (gisLoaded →
 * restoreGoogleToken), (b) giriş oturumundaki provider_token (_onSession).
 * Buton ancak İKİSİ de bitip hiçbiri bağlanamamışsa 'Bağla'ya dönmeli —
 * yoksa hâlâ sürmekte olan bir bağlanmanın ortasında kullanıcıyı elle
 * bağlamaya çağırırdık.
 */
const _otoBaglanma = { onbellek: false, oturum: false };
function otoBaglanmaBitti(yol) {
  _otoBaglanma[yol] = true;
  if (!_otoBaglanma.onbellek || !_otoBaglanma.oturum) return;
  if (!AppState.googleAccessToken) takvimButonDurumu('bagla');
}
// Güvenlik ağı: GIS betiği hiç yüklenmezse (reklam engelleyici, ağ hatası) o yol
// hiç 'bitti' demez ve buton sonsuza dek 'bağlanıyor'da kalırdı. 12 sn sonra
// ikisini de bitmiş say — 7 sn'lik normal süreye rahat pay bırakıyor.
setTimeout(() => { otoBaglanmaBitti('onbellek'); otoBaglanmaBitti('oturum'); }, 12000);

// ── GOOGLE AUTH ──
function gapiLoaded() {
  gapi.load('client', async () => {
    try {
      await gapi.client.init({ apiKey: CONFIG.GOOGLE_API_KEY, discoveryDocs: [CONFIG.DISCOVERY_DOC] });
      AppState.gapiReady = true;
    } catch(e) { console.error('Google API hatası:', e); }
  });
}
function gisLoaded() {
  AppState.tokenClient = google.accounts.oauth2.initTokenClient({ client_id: CONFIG.GOOGLE_CLIENT_ID, scope: CONFIG.SCOPES, callback: '' });
  AppState.gisReady = true;
  restoreGoogleToken();
}
// Sayfa yenilenince Takvim token'ının hafızadan silinip her seferinde yeniden
// "Google Takvimi Bağla" istemesini önler — token süresi (~1 saat) dolmadıysa
// localStorage'dan geri yüklenir. activateGoogleCalendar zaten gapiReady'yi
// bekliyor, o yüzden burada ek bekleme gerekmiyor.
function restoreGoogleToken() {
  try {
    const raw = localStorage.getItem(GOOGLE_TOKEN_STORAGE_KEY);
    if (!raw) { yenilemeyiDene().finally(() => otoBaglanmaBitti('onbellek')); return; }
    const saved = JSON.parse(raw);
    if (!saved?.access_token || !saved?.expiresAt || Date.now() >= saved.expiresAt) {
      // Süre dolmuş: eskiden burada iş biterdi ve kullanıcı takvimi elle
      // bağlamak zorunda kalırdı. Artık refresh token'la sessizce yenileniyor.
      localStorage.removeItem(GOOGLE_TOKEN_STORAGE_KEY);
      yenilemeyiDene().finally(() => otoBaglanmaBitti('onbellek'));
      return;
    }
    activateGoogleCalendar(saved.access_token).finally(() => otoBaglanmaBitti('onbellek'));
  } catch(e) {
    localStorage.removeItem(GOOGLE_TOKEN_STORAGE_KEY);
    yenilemeyiDene().finally(() => otoBaglanmaBitti('onbellek'));
  }
}

/**
 * Refresh token'ı kullanıcının kendi profil satırına yazar (RLS: yalnızca sahibi
 * okuyup yazabiliyor). localStorage yerine burada duruyor ki başka bir cihazda
 * ilk açılışta da takvim kendiliğinden bağlansın.
 * Hata YUTULUR: saklanamazsa yalnızca otomatik yenileme çalışmaz, giriş bozulmaz.
 */
async function saklaYenilemeTokeni(refreshToken) {
  try {
    const { error } = await window.supabaseClient
      .from('profiles')
      .update({ google_refresh_token: refreshToken })
      .eq('id', currentUser?.id);
    if (error) throw error;
    // auth.html bunu görüp bir sonraki girişte izin ekranını atlıyor.
    try { localStorage.setItem('focusaid_gcal_offline', '1'); } catch (e) {}
    console.log('[Takvim] yenileme anahtarı saklandı');
  } catch (e) {
    console.warn('[Takvim] yenileme anahtarı saklanamadı:', e?.message || e);
  }
}

/**
 * Access token'ın süresi dolduysa sunucu üzerinden sessizce yeniler.
 *
 * Yenileme İSTEMCİ SECRET'I gerektiriyor, o yüzden tarayıcıda yapılamaz —
 * refresh token serve.py'deki /api/google/refresh ucuna gönderiliyor, secret
 * orada duruyor (bkz. GOOGLE_CLIENT_SECRET ortam değişkeni).
 *
 * Hata YUTULUR: yenilenemezse kullanıcı "Google Takvimi Bağla" butonuyla elle
 * bağlayabiliyor — yani en kötü ihtimalde eski davranışa dönülüyor.
 */
async function yenilemeyiDene() {
  try {
    if (!currentUser?.id) return;                       // oturum henüz kurulmadı
    const { data, error } = await window.supabaseClient
      .from('profiles').select('google_refresh_token').eq('id', currentUser.id).single();
    if (error || !data?.google_refresh_token) return;   // hiç izin alınmamış

    const res = await fetch('/api/google/refresh', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: data.google_refresh_token })
    });
    const govde = await res.json().catch(() => ({}));
    if (!res.ok || !govde.access_token) {
      console.warn('[Takvim] token yenilenemedi:', govde.error || res.status);
      // invalid_grant: kullanıcı izni geri almış ya da token iptal olmuş.
      // Ölü anahtarı temizle ki her açılışta boşuna denenmesin.
      if (govde.error === 'invalid_grant') {
        await window.supabaseClient.from('profiles')
          .update({ google_refresh_token: null }).eq('id', currentUser.id);
        // Bayrağı da temizle ki bir sonraki giriş izin ekranını gösterip
        // yeni bir yenileme anahtarı alsın.
        try { localStorage.removeItem('focusaid_gcal_offline'); } catch (e) {}
      }
      return;
    }
    localStorage.setItem(GOOGLE_TOKEN_STORAGE_KEY, JSON.stringify({
      access_token: govde.access_token,
      expiresAt: Date.now() + (Number(govde.expires_in || 3600) * 1000)
    }));
    await activateGoogleCalendar(govde.access_token);
    console.log('[Takvim] token sessizce yenilendi');
  } catch (e) {
    console.warn('[Takvim] yenileme denemesi başarısız:', e?.message || e);
  }
}
// Google Calendar'ı aktifleştirir: token'ı GAPI'ye set eder, butonu günceller, etkinlikleri yükler
async function activateGoogleCalendar(token) {
  AppState.googleAccessToken = token;
  let waited = 0;
  while (!AppState.gapiReady && waited < 8000) {
    await new Promise(r => setTimeout(r, 200));
    waited += 200;
  }
  if (AppState.gapiReady) {
    gapi.client.setToken({ access_token: token });
    takvimButonDurumu('bagli');
  }
  AppState.calendar?.refetchEvents();
}

/**
 * Token takvime yetiyor mu? Tek satırlık salt-okunur bir istekle ölçülür.
 * Gerekli: giriş sırasında kullanıcı takvim iznini REDDETMİŞ olabilir; o durumda
 * provider_token yine gelir ama events.list 403 döner. Ölçmeden bağlarsak buton
 * "✓ Takvim Bağlandı" der, kullanıcı bağlandığını sanır ve ilk yazmada patlar.
 */
async function tokenTakvimeYetiyorMu(token) {
  let beklendi = 0;
  while (!AppState.gapiReady && beklendi < 8000) {
    await new Promise(r => setTimeout(r, 200));
    beklendi += 200;
  }
  if (!AppState.gapiReady) return false;
  try {
    gapi.client.setToken({ access_token: token });
    await gapi.client.calendar.events.list({ calendarId: 'primary', maxResults: 1 });
    return true;
  } catch (e) {
    console.warn('[Takvim] oturum token\'ı takvime yetmiyor:', e?.result?.error?.message || e?.message);
    return false;
  }
}

/**
 * Girişten gelen provider_token ile takvimi bağlar. Hata YUTULUR: bağlanamazsa
 * kullanıcı "Google Takvimi Bağla" butonuyla elle bağlayabiliyor.
 *
 * Süre: Google access token'ı ~1 saat yaşıyor ve sessizce yenilenemiyor
 * (yenileme refresh_token + client secret ister, tarayıcıda tutulamaz).
 * Bu yüzden token yerel olarak saklanıyor ve süresi dolunca buton geri geliyor.
 */
async function baglaOturumTokeniyle(token) {
  try {
    if (AppState.googleAccessToken) return;            // zaten bağlı
    if (!await tokenTakvimeYetiyorMu(token)) return;   // izin verilmemiş
    // İkinci kontrol: doğrulama sürerken restoreGoogleToken → yenilemeyiDene
    // yolu bağlantıyı çoktan kurmuş olabilir (ikisi de sayfa açılışında koşuyor).
    // Bu satır olmadan her açılışta takvim iki kez aktifleştiriliyor ve
    // gereksiz bir Google isteği daha atılıyordu.
    if (AppState.googleAccessToken) return;
    // Google provider_token'ının kalan ömrünü söylemiyor; ~1 saat varsayıp
    // saklıyoruz. Süre dolarsa istek 401 döner ve kullanıcı elle bağlar.
    localStorage.setItem(GOOGLE_TOKEN_STORAGE_KEY,
      JSON.stringify({ access_token: token, expiresAt: Date.now() + 3600 * 1000 }));
    await activateGoogleCalendar(token);
    console.log('[Takvim] giriş oturumundan otomatik bağlandı');
  } catch (e) {
    console.warn('[Takvim] otomatik bağlanamadı:', e);
  }
}

function handleAuthClick() {
  if (!AppState.gisReady) { showToast('Google henüz hazır değil, bekle.', 'error'); return; }
  AppState.tokenClient.callback = async (resp) => {
    if (resp.error) return;
    const t = gapi.client.getToken();
    if (t?.access_token) {
      const expiresAt = Date.now() + (Number(resp.expires_in || 3600) * 1000);
      localStorage.setItem(GOOGLE_TOKEN_STORAGE_KEY, JSON.stringify({ access_token: t.access_token, expiresAt }));
      await activateGoogleCalendar(t.access_token);
    }
  };
  AppState.tokenClient.requestAccessToken({ prompt: gapi.client.getToken() === null ? 'consent' : '' });
}

// ── TAKVİM ──
// ── MİNİ AY TAKVİMİ ──
// İkinci bir FullCalendar örneği DEĞİL: bu iş için gereksiz ağır olurdu.
// Saf tarih hesabı calendar-logic.js'te, burada yalnızca DOM var.
const MiniState = { year: 0, month: 0, selected: '' };

// İki harf: tek harfte üç 'P' ve iki 'C' çıkıp ayırt edilemiyordu.
// Pazartesi'den basliyor: buyuk takvim gercek 'tr' locale'iyle (dow:1) oyle
// render ediliyor, iki izgara hizali kalmali (bkz. buildMonthGrid).
const MINI_GUN_BASLIKLARI = ['Pt', 'Sa', 'Ça', 'Pe', 'Cu', 'Ct', 'Pa'];

/** Mini takvimi çizer. Hata YUTULUR: yan panel çökse de büyük takvim çalışır. */
function renderMiniCalendar() {
  try {
    const grid = document.getElementById('mini-calendar-grid');
    const label = document.getElementById('mini-calendar-label');
    if (!grid || !label) return;

    label.textContent = monthLabel(MiniState.year, MiniState.month);
    const bugun = localDayISO();

    const basliklar = MINI_GUN_BASLIKLARI
      .map(g => `<div class="text-[10px] font-black pb-1" style="color:var(--text-soft)">${g}</div>`)
      .join('');

    const hucreler = buildMonthGrid(MiniState.year, MiniState.month).map(c => {
      const secili = c.iso === MiniState.selected;
      const buguneMi = c.iso === bugun;
      let stil = 'color:var(--text-soft)';
      if (!c.inMonth) stil = 'color:var(--text-soft);opacity:.35';
      if (buguneMi) stil = 'color:var(--indigo-main);font-weight:800';
      if (secili) stil = 'background:var(--indigo-main);color:#fff;font-weight:800';
      return `<button type="button" data-iso="${c.iso}"
                class="mini-day w-7 h-7 mx-auto rounded-full text-[11px] transition-colors"
                style="${stil}">${c.day}</button>`;
    }).join('');

    grid.innerHTML = basliklar + hucreler;

    grid.querySelectorAll('.mini-day').forEach(b => {
      b.onclick = () => {
        const iso = b.dataset.iso;
        MiniState.selected = iso;
        AppState.calendar?.gotoDate(iso);
        renderMiniCalendar();
      };
    });

    const prev = document.getElementById('mini-prev');
    const next = document.getElementById('mini-next');
    if (prev) prev.onclick = () => {
      Object.assign(MiniState, shiftMonth(MiniState.year, MiniState.month, -1));
      renderMiniCalendar();
    };
    if (next) next.onclick = () => {
      Object.assign(MiniState, shiftMonth(MiniState.year, MiniState.month, 1));
      renderMiniCalendar();
    };
  } catch (e) {
    console.warn('[Mini Takvim] çizilemedi:', e);
  }
}

/**
 * Büyük takvim gezinince mini takvimi hizalar.
 * SONSUZ DÖNGÜ KORUMASI: yalnızca görünen AY değiştiyse yeniden çizer.
 * (gotoDate → datesSet → syncMiniCalendar zinciri her seferinde yeniden
 * çizseydi tıklama sonsuz döngüye girerdi.)
 */
function syncMiniCalendar(dateISO) {
  try {
    const [y, m] = dateISO.split('-').map(Number);
    if (MiniState.year === y && MiniState.month === m - 1) return;
    MiniState.year = y;
    MiniState.month = m - 1;
    renderMiniCalendar();
  } catch (e) {
    console.warn('[Mini Takvim] senkron edilemedi:', e);
  }
}

// ── HAFTALIK ÖZET ──
/**
 * Bugünü içeren haftanın (Paz–Cmt) tamamlanma oranı.
 * Büyük takvimin gezinmesinden BAĞIMSIZ: her zaman "bu hafta"yı gösterir.
 * Gezinmeyle senkron tutmak ek karmaşıklık getirir, karşılığı yok (YAGNI).
 * Hata YUTULUR: kart "—" gösterir, mini takvim ve büyük takvim çalışmaya devam eder.
 */
async function renderWeekOverview() {
  const textEl = document.getElementById('week-overview-text');
  const barEl = document.getElementById('week-overview-bar');
  if (!textEl || !barEl) return;

  try {
    if (!currentUser) return;
    const { start, end } = weekRangeISO(localDayISO());

    const { data, error } = await sb
      .from('tasks')
      .select('completed')
      .eq('user_id', currentUser.id)
      .gte('day', start)
      .lte('day', end);

    if (error) throw error;

    const toplam = (data || []).length;
    const biten = (data || []).filter(t => t.completed).length;
    textEl.textContent = toplam ? `${biten}/${toplam} görev tamamlandı` : 'Bu hafta görev yok';
    barEl.style.width = toplam ? `${Math.round((biten / toplam) * 100)}%` : '0%';
  } catch (e) {
    console.warn('[Haftalık Özet] yüklenemedi:', e);
    textEl.textContent = '—';
    barEl.style.width = '0%';
  }
}

function initCalendar() {
  const el = document.getElementById('calendar');
  if (!el) return;
  try {
    // Takvim sayfasina her donuste loadPage DOM'u siliyor ama FullCalendar
    // ornegi kendi window/document dinleyicilerini ve nowIndicator'in
    // setTimeout zincirini birakmiyor. destroy() cagrilmazsa her ziyarette
    // bir tane daha birikiyor.
    AppState.calendar?.destroy();
    initCalendarUnsafe(el);
    const bugun = localDayISO();
    const [by, bm] = bugun.split('-').map(Number);
    MiniState.year = by;
    MiniState.month = bm - 1;
    MiniState.selected = bugun;
    renderMiniCalendar();
    renderWeekOverview();   // await YOK: takvimin açılmasını bekletmez
  } catch (e) {
    console.error('[Takvim] initCalendar çöktü:', e);
    el.innerHTML = `<div class="p-8 text-center text-red-500">❌ Takvim yüklenemedi: ${(e?.message || e).toString().replace(/</g,'&lt;')}</div>`;
  }
}
// Kart renkleri bilişsel yüke bağlı — Bugün ekranındaki YUK_KENAR ile aynı
// anlam ekseni (yeşil=hafif, amber=orta, kırmızımsı=ağır). Renk dekoratif
// değil, bilgi taşıyor: DEHB kullanıcısı için gün planının ağırlığı bir
// bakışta görünmeli.
// NOT: veritabanında hem 'low/medium/high' hem eski 'Hafif/Orta/Ağır'
// değerleri bulunabiliyor, ikisi de eşlenmiş. Tonlar, beyaz yazı metni küçük
// font boyutlarında WCAG AA 4.5:1 kontrast eşiğini karşılamak için bir adım koyulaştırılmıştır.
const YUK_RENK = {
  low: '#047857', medium: '#b45309', high: '#e11d48',
  Hafif: '#047857', Orta: '#b45309', Ağır: '#e11d48'
};
const RENK_TAMAMLANAN = '#64748b';
const RENK_GCAL = '#9333ea';
const RENK_MOLA = '#0f766e';
/** FullCalendar etkinliginin dakika cinsinden suresi; bitisi yoksa 0. */
function eventMinutes(ev) {
  const bas = ev?.start, bit = ev?.end;
  return (bas && bit) ? (bit - bas) / 60000 : 0;
}

function initCalendarUnsafe(el) {
  // Yeni ornek asagidaki height:'auto' ile aciliyor; datesSet'in karsilastirma
  // yaptigi durum onceki ornekten kalmasin (bkz. initCalendar'daki destroy()).
  AppState.calendarHeight = 'auto';
  AppState.calendar = new FullCalendar.Calendar(el, {
    initialView: 'dayGridMonth', locale: 'tr',
    // firstDay ARTIK VERILMIYOR: gercek 'tr' locale paketi yuklendigi icin
    // (bkz. <head>'deki tr.global.min.js) hafta basi locale'den dow:1 olarak
    // geliyor. Elle sabitlemek locale ile celisir ve mini takvimden kaydirirdi.
    // buildMonthGrid ve weekRangeISO de Pazartesi-baslangicli.
    headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth,timeGridWeek' },
    height: 'auto',
    // Ay ve hafta görünümü farklı boyutlanıyor: ay hücre başına en fazla 2
    // görev önizlemesi gösterip gerisini "+N daha"ya gizliyor (bkz. moreLinkClick),
    // hafta sadece uyanık saatleri gösteriyor (00:00-24:00 tamamı sıkışık ve
    // okunaksız kalıyordu).
    views: {
      dayGridMonth: { dayMaxEvents: 2 },
      // allDaySlot ACIK: kapaliyken Google Calendar'in tum-gun etkinlikleri
      // (tatiller, dogum gunleri, "izin" gibi kayitlar) hafta gorunumunde HIC
      // gorunmuyordu — ay gorunumune gecmeden fark edilemiyorlardi. dayMaxEvents
      // burada YALNIZCA tum-gun seridini sinirlar (saat izgarasini degil): serit
      // kalabalik bir haftada 700px'lik kutuyu yiyecek kadar buyuyemesin.
      timeGridWeek: { slotMinTime: '07:00:00', slotMaxTime: '23:00:00', slotDuration: '01:00:00', expandRows: true,
                      allDaySlot: true, allDayText: 'Tüm gün', dayMaxEvents: 2 }
    },
    // Hafta görünümü height:'auto' ile sayfayı ~1400px'e kadar şişiriyordu.
    // datesSet ile görünüm değişince kalendarın kendi height'ını değiştiriyoruz:
    // ay 'auto' kalsın, hafta sabit 700px'lik bir kutuya sığıp İÇİNDE kaysın
    // (FullCalendar bunu height sabitlenince otomatik yapıyor). 16 saatlik
    // satır toplamı kutudan biraz taşıyor — bilerek: kullanıcı "kaydırmadan
    // yönde sıkıntım yok, sürekli kaydır kaydır olmasın" dedi, o yüzden
    // TAMAMEN sıkıştırmak (satırları okunmaz kılmak) yerine hafif taşma +
    // hafif iç kaydırma tercih edildi.
    datesSet(info) {
      // setOption HER gezinmede degil, yalnizca yukseklik gercekten degistiginde:
      // setOption tam bir re-render tetikliyor, ayni ay icinde ileri-geri gezinirken
      // (ve mini takvim gotoDate cagirdiginda) bu render bosa gidiyordu.
      const yukseklik = heightForView(info.view.type);
      if (yukseklik !== AppState.calendarHeight) {
        AppState.calendarHeight = yukseklik;
        AppState.calendar?.setOption('height', yukseklik);
      }
      // info.start görünen aralığın ilk günü; ay görünümünde önceki aya
      // taşabildiği için ortadaki günü baz alıyoruz.
      const orta = new Date((info.start.getTime() + info.end.getTime()) / 2);
      syncMiniCalendar(localDayISO(orta));
    },
    scrollTime: '08:00:00',
    // Kartın içeriğini süreye göre seçiyoruz. ÖNCEKİ SORUN: saat + başlık
    // her zaman birlikte basılıyordu; kısa görevlerde kutuya sığmayıp
    // overflow:hidden ikisini birden kırpıyor, kart boş renkli bir dikdörtgene
    // dönüyordu. 45 dakikanın altındaki kartlarda saat gizlenir, başlık kalır.
    eventContent(arg) {
      const baslik = (arg.event.title || '').trim() || 'Görev';
      if (arg.view.type !== 'timeGridWeek') return true;   // ay görünümü FullCalendar'ın kendi render'ında kalsın
      // Tüm-gün etkinlikleri saat ızgarasında değil üstteki şeritte duruyor; süreye
      // bağlı kart mantığı orada anlamsız (arg.timeText de boş gelir).
      if (arg.event.allDay) return true;

      const dakika = eventMinutes(arg.event);
      const bicim = cardLayout(dakika);
      const kutu = document.createElement('div');
      kutu.className = 'fc-ozel-kart';
      // Karta sığacak satır sayısı: 45px/saat slot yüksekliğinde bir satır ~13.8px.
      // 60dk = 45px -> saat + 2 satır; 90dk+ -> saat + 3 satır; altındakiler tek satır.
      kutu.style.setProperty('--satir', bicim.satir);
      if (bicim.kisa) kutu.classList.add('fc-ozel-kart--mini');

      if (bicim.saatGoster) {
        const saat = document.createElement('div');
        saat.className = 'fc-ozel-saat';
        saat.textContent = arg.timeText;
        kutu.appendChild(saat);
      }
      const ad = document.createElement('div');
      ad.className = 'fc-ozel-baslik';
      ad.textContent = baslik;
      kutu.appendChild(ad);

      return { domNodes: [kutu] };
    },
    // 20dk'lik bir kart hafta gorunumunde ~15px; FullCalendar'in kendi 1px ust+alt
    // kenarligi ve dikey padding'i bunun 4px'ini aliyor, geriye kalan yer 10.9px'lik
    // baslik satirina KILPAYI yetmiyor ve satirin alti kirpiliyordu. Kisa kartlarda
    // ikisi de sifirlaniyor (bkz. .fc-olay-kisa) — kenarlik zaten kart rengiyle ayni.
    eventClassNames(arg) {
      if (arg.view.type !== 'timeGridWeek' || arg.event.allDay) return [];
      return cardLayout(eventMinutes(arg.event)).kisa ? ['fc-olay-kisa'] : [];
    },
    aspectRatio: 1.9,
    nowIndicator: true,
    selectable: true, editable: true,
    dateClick(info) { try { openDayView(info.dateStr); } catch (e) { console.error('[Takvim] dateClick hata:', e); } },
    // "+N daha" linkine tıklayınca FullCalendar'ın kendi popover'ı yerine
    // bizim gün-detay modalimiz açılsın (tutarlılık için). NOT: moreLinkClick'in
    // argümanında dateStr YOK (dateClick'ten farklı) — info.date kullanılmalı,
    // ve toISOString() UTC verdiği için yerel tarihi bir gün kaydırabiliyordu;
    // localDayISO ile düzeltildi. Dönüş değeri FullCalendar'ın kabul ettiği
    // 'false' — daha önce kullanılan 'none' resmi API'de yok.
    moreLinkClick(info) {
      try { openDayView(localDayISO(info.date)); } catch (e) { console.error('[Takvim] moreLinkClick hata:', e); }
      return false;
    },
    eventClick(info) { try { openTaskForm(info.event.startStr.split('T')[0], info.event); } catch (e) { console.error('[Takvim] eventClick hata:', e); } },
    events: async (info, successCb, failureCb) => {
      try {
        const events = [];
        const startDate = info.startStr.split('T')[0];
        const endDate = info.endStr.split('T')[0];
        // n8n her görev için HEM Supabase satırı HEM Google Calendar etkinliği
        // oluşturuyor (calendar_event_id ile eşleşiyorlar) — ikisini de ham
        // haliyle takvime basarsak her görev iki kez görünür. Yoğun kullanıcılarda
        // (100+ görev) bu hem görsel karmaşa hem de hafta görünümünde onlarca
        // çakışan etkinliği aynı anda düzenlemeye çalışan FullCalendar için ciddi
        // bir performans/donma riski yaratıyor. Supabase'te zaten temsil edilen
        // GCal etkinliklerini burada eleyip tekilleştiriyoruz.
        const eslenmisGcalIdleri = new Set();

        // 1. Supabase'den tasks'ı çek
        try {
          const { data: tasks, error: tasksError } = await window.supabaseClient
            .from('tasks')
            .select('*')
            .eq('user_id', currentUser?.id)
            .gte('day', startDate)
            .lte('day', endDate);

          if (!tasksError && tasks) {
            events.push(...tasks.map(task => {
              if (task.calendar_event_id) eslenmisGcalIdleri.add(task.calendar_event_id);
              return {
                id: `task-${task.id}`,
                title: (task.name || '').trim() || 'Görev',
                start: task.start_time,
                end: task.end_time,
                extendedProps: {
                  // Supabase'de açıklama `summary` kolonunda (n8n de oraya yazıyor).
                  // Burada `task.description` okunuyordu — tabloda öyle bir kolon
                  // yok, yani açıklama hiçbir zaman görünmüyordu.
                  description: task.summary || '',
                  cognitive_load: task.cognitive_load || 'Orta'
                },
                backgroundColor: task.completed
                  ? RENK_TAMAMLANAN
                  : (YUK_RENK[task.cognitive_load] || YUK_RENK.medium),
                textColor: '#ffffff',
                borderColor: 'transparent'
              };
            }));
            console.log(`[Takvim] Supabase'den ${tasks.length} görev yüklendi`, tasks.slice(0,3).map(t => ({title: t.title, id: t.id, day: t.day, start_time: t.start_time})));
          }
        } catch(e) { console.warn('[Takvim] Supabase tasks yüklenemedi:', e); }

        // 2. Google Calendar'dan events'ı çek — Supabase'te zaten temsil edilenler hariç
        if (AppState.gapiReady && AppState.googleAccessToken) {
          try {
            gapi.client.setToken({ access_token: AppState.googleAccessToken });
            const resp = await gapi.client.calendar.events.list({
              calendarId: 'primary',
              timeMin: info.startStr,
              timeMax: info.endStr,
              singleEvents: true,
              orderBy: 'startTime'
            });
            if (resp.result.items) {
              const tekilGcalEtkinlikleri = resp.result.items.filter(ev => !eslenmisGcalIdleri.has(ev.id));
              events.push(...tekilGcalEtkinlikleri.map(ev => ({
                id: ev.id,
                title: ev.summary || 'Görev',
                start: ev.start?.dateTime || ev.start?.date,
                end: ev.end?.dateTime || ev.end?.date,
                extendedProps: { description: ev.description || '' },
                backgroundColor: (ev.summary || '').includes('Mola') ? RENK_MOLA : RENK_GCAL,
                textColor: '#ffffff',
                borderColor: 'transparent'
              })));
              console.log(`[Takvim] Google Calendar'dan ${resp.result.items.length} etkinlik geldi, ${tekilGcalEtkinlikleri.length} tekil eklendi (${resp.result.items.length - tekilGcalEtkinlikleri.length} zaten Supabase'te vardı)`);
            }
          } catch(e) { console.warn('[Takvim] Google Calendar events yüklenemedi:', e); }
        }

        successCb(events);
      } catch(e) { console.error('Takvim etkinlikleri yüklenemedi:', e); failureCb(e); }
    }
  });
  AppState.calendar.render();
  // Eğer Supabase'den token zaten varsa hemen aktifleştir
  if (AppState.googleAccessToken) activateGoogleCalendar(AppState.googleAccessToken);
}

// ── GÖREV FORMU ──
function openTaskForm(date, ev = null) {
  const panel = document.getElementById('task-form-panel');
  if (!panel) return;
  const set = (id, v) => { const el = document.getElementById(id); if (el) el.value = v ?? ''; };
  const now = new Date();
  set('task-date',  date);
  set('task-title', ev?.title ?? '');
  set('task-desc',  ev?.extendedProps?.description ?? '');
  set('task-start', ev ? ev.startStr.split('T')[1]?.slice(0,5) : `${String(now.getHours()).padStart(2,'0')}:00`);
  updateEndTime();
  panel.classList.remove('hidden');
  panel.classList.add('animate-slide-in');
  ayarlaParcalaSecenegi();   // await YOK: form hemen açılsın, kutu ölçüm gelince güncellenir
  document.getElementById('task-title')?.focus();
}
function closeForm() { document.getElementById('task-form-panel')?.classList.add('hidden'); }

// ── GÜN DETAYLARI MODAL ──
async function openDayView(dateStr) {
  const modal = document.getElementById('day-modal');
  const dateEl = document.getElementById('day-modal-date');
  const tasksList = document.getElementById('day-tasks-list');
  if (!modal || !dateEl || !tasksList) return;

  // Tarihi güzel format'la
  const date = new Date(dateStr + 'T00:00:00');
  const formatter = new Intl.DateTimeFormat('tr-TR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  dateEl.textContent = formatter.format(date);

  // Ham tarihi modalda sakla. openNewTaskForDay bunu okur — EKRANDAKİ METNİ DEĞİL.
  // Eskiden tarih 'day-modal-date'in textContent'inden geri okunuyordu ama orada
  // "23 Ağustos 2026 Pazar" gibi yerelleştirilmiş metin var; new Date() bunu
  // ayrıştıramayıp Invalid Date veriyor, toISOString() de RangeError fırlatıyordu.
  // Sonuç: "+ Yeni Görev" hiç çalışmıyordu.
  modal.dataset.iso = dateStr;
  modal.dataset.gorevSayisi = '0';

  // Seçim mini takvimde de işaretlensin: yan paneldeki "+ Yeni Görev" bu seçimi
  // kullanıyor, kullanıcının az önce tıkladığı günle tutarlı olmalı.
  MiniState.selected = dateStr;
  renderMiniCalendar();

  // Yükleniyor göster
  tasksList.innerHTML = '<div class="text-center text-slate-400 py-8">Görevler yükleniyor...</div>';
  modal.classList.remove('hidden');

  try {
    // Supabase'ten o günün görevlerini çek
    const { data, error } = await window.supabaseClient
      .from('tasks')
      .select('*')
      .eq('user_id', currentUser?.id)
      .eq('day', dateStr)
      .order('start_time', { ascending: true });

    if (error) throw error;

    // Yoğun gün uyarısı bu sayıyı kullanıyor (bkz. openNewTaskForDay).
    modal.dataset.gorevSayisi = String(data?.length || 0);

    if (!data || data.length === 0) {
      tasksList.innerHTML = '<div class="text-center text-slate-400 py-8">📭 Bu gün için görev yok</div>';
      return;
    }

    // Görevleri listele
    tasksList.innerHTML = data.map(task => {
      const start = task.start_time ? new Date(task.start_time).toLocaleTimeString('tr-TR', {hour: '2-digit', minute: '2-digit'}) : '--:--';
      const end = task.end_time ? new Date(task.end_time).toLocaleTimeString('tr-TR', {hour: '2-digit', minute: '2-digit'}) : '--:--';
      const isCompleted = task.completed === true;
      const statusColor = isCompleted ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700';
      const statusText = isCompleted ? '✓ Tamamlandı' : '⏳ Bekleniyor';

      return `
        <div class="p-5 bg-slate-50 rounded-2xl border border-slate-200 hover:border-indigo-300 hover:shadow-md transition-all">
          <div class="flex justify-between items-start gap-4 mb-3">
            <div class="flex-1">
              <h4 class="font-bold text-slate-900 text-lg">${task.name || task.title || 'Görev'}</h4>
              <p class="text-sm text-slate-600 mt-1">${task.summary || ''}</p>
            </div>
            <span class="text-xs font-bold px-3 py-1.5 rounded-full whitespace-nowrap ${statusColor}">${statusText}</span>
          </div>
          <div class="flex gap-4 items-center text-sm">
            <span class="font-mono font-semibold text-indigo-600">🕐 ${start} - ${end}</span>
            ${task.cognitive_load ? `<span class="bg-purple-100 text-purple-700 px-2.5 py-1 rounded-full text-xs font-bold">Yoğunluk: ${task.cognitive_load}</span>` : ''}
          </div>
        </div>
      `;
    }).join('');
  } catch (err) {
    console.error('Görevler yüklenemedi:', err);
    console.error('User ID:', currentUser?.id, 'Date:', dateStr);
    console.error('Supabase client:', window.supabaseClient ? 'OK' : 'NULL');
    const errMsg = err?.message || err?.details || err?.error_description || err?.hint || (typeof err === 'string' ? err : 'Bilinmeyen hata');
    console.error('Error message:', errMsg);
    tasksList.innerHTML = `<div class="text-center text-red-500 py-8">❌ ${errMsg}</div>`;
  }
}

function closeDayModal(event) {
  if (event && event.target.id !== 'day-modal') return; // Sadece arka plana tıklanırsa kapat
  document.getElementById('day-modal')?.classList.add('hidden');
}

/**
 * Geçmiş gün: ENGELLE. Biten bir güne plan yapmak takvimi kirletiyor ve
 * "Bugün" ekranındaki devreden-görev mantığıyla çakışıyor.
 * Görev eklemenin İKİ girişi var (gün modalı ve yan panel), kural tek yerde durmalı.
 */
function gunEklemeyeAcikMi(gunISO) {
  if (isPastDay(gunISO, localDayISO())) {
    showToast('Geçmiş günlere görev ekleyemezsin!', 'error');
    return false;
  }
  return true;
}

/** Yoğun gün: UYAR ama engelleme. Karar kullanıcının. */
function yogunGunUyar(gorevSayisi) {
  if (isBusyDay(gorevSayisi)) {
    showToast(`Bu gün zaten dolu görünüyor (${gorevSayisi} görev). Yine de ekleyebilirsin.`, 'info');
  }
}

/** Bir günün görev sayısı. Hata YUTULUR: sayı alınamazsa uyarı atlanır, form yine açılır. */
async function countTasksForDay(gunISO) {
  try {
    const { count, error } = await window.supabaseClient
      .from('tasks')
      .select('id', { count: 'exact', head: true })
      .eq('user_id', currentUser?.id)
      .eq('day', gunISO);
    if (error) throw error;
    return count || 0;
  } catch (e) {
    console.warn('[Takvim] gün görev sayısı alınamadı:', e);
    return 0;
  }
}

// Gün modalındaki "+ Yeni Görev".
function openNewTaskForDay() {
  const modal = document.getElementById('day-modal');
  const gunISO = modal?.dataset.iso;
  if (!gunISO) return;
  if (!gunEklemeyeAcikMi(gunISO)) return;   // modal açık kalsın; kullanıcı o günü görmeye devam etsin

  // Modal o günün görevlerini zaten çekti, sayı dataset'te hazır — ağ turu gerekmiyor.
  yogunGunUyar(Number(modal.dataset.gorevSayisi || 0));
  closeDayModal();
  openTaskForm(gunISO);
}

/**
 * Yan paneldeki "+ Yeni Görev": mini takvimde SEÇİLİ günü açar.
 * Eskiden koşulsuz localDayISO() (bugün) açıyordu — kullanıcı mini takvimden
 * başka bir gün seçtikten sonra bile forma bugünün tarihi geliyor, seçim
 * sessizce yok sayılıyordu. Gün modalıyla aynı kurallar burada da geçerli.
 */
async function openNewTaskForSelectedDay() {
  const gunISO = MiniState.selected || localDayISO();
  if (!gunEklemeyeAcikMi(gunISO)) return;   // geçmiş gün: sayım için ağa çıkmaya gerek yok
  yogunGunUyar(await countTasksForDay(gunISO));
  openTaskForm(gunISO);
}

function updateEndTime() {
  const s = document.getElementById('task-start')?.value;
  if (!s) return;
  const [h,m] = s.split(':').map(Number);
  const el = document.getElementById('task-end');
  if (el) el.value = `${String((h+1)%24).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}

// ── GÖREV EKLEME: TEK GİRİŞ ──
// Formun tek butonu buradan geçiyor; hangi yolun izleneceğini "parçala"
// kutusu belirliyor. İki ayrı buton yerine tek karar (bkz. form markup'ı).
function submitTaskForm() {
  const kutu = document.getElementById('task-split');
  return (kutu?.checked && !kutu.disabled) ? triggerN8N_Split() : saveTask();
}

/** Formun tek gönder butonu. İki akış da aynı butonu kilitleyip serbest bırakıyor. */
const EKLE_ETIKETI = 'Ekle';
function formGonderButonu() {
  return document.querySelector('button[onclick="submitTaskForm()"]');
}

// n8n ölçümü bu süre boyunca yeniden kullanılıyor: form her açılışta ağ turu
// atmasın, ama kullanıcı n8n'i açarsa bir dakika içinde kendiliğinden fark edilsin.
const N8N_KONTROL_OMRU_MS = 60000;
let _n8nSonKontrol = { zaman: 0, ulasilabilir: null };

/**
 * n8n webhook'una ulaşılabiliyor mu?
 *
 * HEAD + no-cors bilinçli: webhook'a POST atmak GERÇEK bir workflow çalıştırırdı,
 * yoklama uğruna görev üretmek kabul edilemez. no-cors yanıtı opak olduğu için
 * durum kodunu okuyamıyoruz — zaten umursamıyoruz, tek soru "sunucu orada mı".
 * Canlıda (https) yerel http://localhost:5678 adresine istek zaten karma-içerik
 * kuralıyla engelleniyor; o da doğru cevabı veriyor: ulaşılamıyor.
 */
async function n8nUlasilabilirMi() {
  const simdi = Date.now();
  if (_n8nSonKontrol.ulasilabilir !== null && simdi - _n8nSonKontrol.zaman < N8N_KONTROL_OMRU_MS) {
    return _n8nSonKontrol.ulasilabilir;
  }
  let ulasilabilir = false;
  try {
    await fetch(CONFIG.N8N_WEBHOOK, { method: 'HEAD', mode: 'no-cors', cache: 'no-store',
                                      signal: AbortSignal.timeout(2500) });
    ulasilabilir = true;
  } catch (e) {
    console.warn('[n8n] ulaşılamıyor:', e?.message || e);
  }
  _n8nSonKontrol = { zaman: simdi, ulasilabilir };
  return ulasilabilir;
}

/**
 * Parçalama seçeneğini forma göre ayarlar: varsayılan AÇIK (uygulamanın asıl işi bu),
 * ama n8n'e ulaşılamıyorsa kapatılıp kilitleniyor ve sebebi yazılıyor. Çalışmayan bir
 * seçeneği işaretli bırakıp kullanıcıyı hata toast'ıyla karşılamak en kötüsü olurdu.
 */
async function ayarlaParcalaSecenegi() {
  const kutu = document.getElementById('task-split');
  const not  = document.getElementById('split-note');
  if (!kutu) return;
  kutu.checked = true;
  kutu.disabled = false;
  not?.classList.add('hidden');

  if (await n8nUlasilabilirMi()) return;

  kutu.checked = false;
  kutu.disabled = true;
  if (not) {
    not.textContent = 'n8n şu an çalışmıyor — görev bölünmeden tek parça eklenecek.';
    not.classList.remove('hidden');
  }
}

// ── GÖREVİ KAYDET ──
/**
 * Görevi Google Calendar'a DA işler. Best-effort: bağlı değilse ya da API hata
 * verirse görev yine Supabase'de durur, akış bozulmaz.
 * @returns {{durum:'islendi'|'baglisiz'|'hata', id?:string}}
 */
async function takvimeIsle(satir) {
  if (!AppState.gapiReady || !AppState.googleAccessToken) return { durum: 'baglisiz' };
  try {
    const resp = await gapi.client.calendar.events.insert({
      calendarId: 'primary',
      resource: {
        summary: satir.name,
        description: satir.summary || '',
        // start_time/end_time zaten UTC ISO ('...Z'); timeZone etkinliğin
        // görüntüleneceği dilim olarak veriliyor, anı kaydırmıyor.
        start: { dateTime: satir.start_time, timeZone: CONFIG.TIMEZONE },
        end:   { dateTime: satir.end_time,   timeZone: CONFIG.TIMEZONE }
      }
    });
    return { durum: 'islendi', id: resp?.result?.id || null };
  } catch (e) {
    console.warn('[Görev] Google Calendar etkinliği oluşturulamadı:', e);
    return { durum: 'hata' };
  }
}

/**
 * Kaynak doğruluk SUPABASE: görev önce `tasks` tablosuna yazılır, Google'a
 * işlemek ikinci ve isteğe bağlı adımdır.
 *
 * ESKİDEN (adı `saveTaskToGoogle`'dı) yalnızca Google'a yazıyordu; bunun üç
 * sonucu vardı: (1) takvim bağlı değilse görev hiç kaydedilmiyordu, (2) kaydedilen
 * görevin Supabase satırı olmadığı için "Bugün" ve "Projelerim" ekranlarında
 * (ikisi de `tasks` tablosunu okur) hiç görünmüyordu, (3) token'ın süresi
 * dolduğunda takvimden de kayboluyordu. Artık elle eklenen görev de n8n'in
 * ürettiği görevlerle aynı veri modelinde.
 */
async function saveTask() {
  const title = document.getElementById('task-title')?.value?.trim();
  const date  = document.getElementById('task-date')?.value;
  const start = document.getElementById('task-start')?.value;
  const end   = document.getElementById('task-end')?.value;
  const desc  = document.getElementById('task-desc')?.value ?? '';
  if (!title) { showToast('Bir başlık girmelisin kral! ⚠️', 'error'); return; }
  if (!date || !start || !end) { showToast('Tarih ve saat alanlarını doldur!', 'error'); return; }
  // İkinci savunma hattı: form açıldıktan sonra tarih alanı elle geçmişe
  // çekilebiliyor, o yüzden kontrol openNewTaskForDay'de bırakılamaz.
  if (isPastDay(date, localDayISO())) { showToast('Geçmiş günlere görev ekleyemezsin!', 'error'); return; }

  const satir = buildTaskRow({ dayISO: date, start, end, title, summary: desc });
  if (!satir) { showToast('Bitiş saati başlangıçtan sonra olmalı!', 'error'); return; }

  const btn = formGonderButonu();
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Kaydediliyor...'; }
  try {
    const { data, error } = await window.supabaseClient
      .from('tasks')
      .insert({ ...satir, user_id: currentUser?.id })
      .select('id')
      .single();
    if (error) throw error;

    const takvim = await takvimeIsle(satir);
    // Etkinlik id'sini geri yaz: takvim iki kaynağı bu alanla eşleştirip
    // tekilleştiriyor (bkz. events geri çağrısı), yoksa görev iki kez görünür.
    if (takvim.id) {
      const { error: eslemeHatasi } = await window.supabaseClient
        .from('tasks').update({ calendar_event_id: takvim.id }).eq('id', data.id);
      if (eslemeHatasi) console.warn('[Görev] calendar_event_id yazılamadı:', eslemeHatasi);
    }

    AppState.calendar?.refetchEvents();
    closeForm();
    showToast(
      takvim.durum === 'islendi'  ? '✅ Görev kaydedildi ve takvime işlendi!'
      : takvim.durum === 'baglisiz' ? '✅ Görev kaydedildi. (Google Takvim bağlı değil)'
      : '✅ Görev kaydedildi, ama Google Takvim etkinliği oluşturulamadı.',
      takvim.durum === 'islendi' ? 'success' : 'info'
    );
  } catch (e) {
    console.error('[Görev] kaydedilemedi:', e);
    showToast('❌ Görev kaydedilemedi: ' + (e?.message || 'bilinmeyen hata'), 'error');
  }
  finally { if (btn) { btn.disabled = false; btn.textContent = EKLE_ETIKETI; } }
}

// ── n8n PARÇALAYICI (TAKVİM FORMU) ──
async function triggerN8N_Split() {
  const title = document.getElementById('task-title')?.value?.trim();
  const desc  = document.getElementById('task-desc')?.value ?? '';
  const date  = document.getElementById('task-date')?.value;
  if (!title) { showToast('Parçalamak için bir başlık girmelisin kral! ⚠️', 'error'); return; }
  // Parçalayıcı da aynı form tarihine görev yazıyor — aynı kural burada da geçerli.
  if (date && isPastDay(date, localDayISO())) { showToast('Geçmiş günlere görev ekleyemezsin!', 'error'); return; }
  const btn = formGonderButonu();
  if (btn) { btn.textContent = '⏳ Analiz Ediyor...'; btn.disabled = true; }
  const profile = JSON.parse(localStorage.getItem('focusaid_profile') || '{}');
  // Bayat modu burada da ele: kullanici profil ekranina hic ugramadan Parcala'ya
  // gidebilir, o durumda loadProfileToUI'daki filtre hic calismaz.
  profile.todayMood = moodForToday(profile.todayMood, profile.todayMoodDate, bugunIstanbul());
  try {
    const res = await fetch(CONFIG.N8N_WEBHOOK, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ taskTitle: title, taskDescription: desc, targetDate: date, userProfile: planningProfile(profile), userId: currentUser?.id, supabaseToken: AppState.supabaseToken, googleAccessToken: AppState.googleAccessToken || null }) });
    if (res.ok) { showToast('🧩 Görev parçalandı!', 'success'); AppState.calendar?.refetchEvents(); closeForm(); }
    else throw new Error('n8n ' + res.status);
  } catch(e) { showToast('❌ n8n ulaşılamadı. Webhook açık mı?', 'error'); }
  finally { if (btn) { btn.textContent = EKLE_ETIKETI; btn.disabled = false; } }
}

// ── n8n CHATBOT ──
async function sendTaskToN8N() {
  const taskEl = document.getElementById('task-input');
  const dlEl   = document.getElementById('task-deadline');
  const task   = taskEl?.value?.trim();
  const dl     = dlEl?.value;
  if (!task || !dl) { addMessageToChat('⚠️ Bir görev adı ve teslim tarihi girmelisin kral!', 'error'); return; }

  // Takvim bağlı değilse görevler yine kaydedilir ama Google Takvim'e HİÇBİR ŞEY
  // yazılmaz: n8n'deki "Create an event" node'u token'sız 401 alır ve
  // onError:continue ile sessizce geçer. Kullanıcı bunu ~40 saniyelik
  // parçalamanın SONUNDA değil, baştan bilsin.
  if (!AppState.googleAccessToken) {
    showConfirm(
      'Takvim bağlı değil',
      'Görevlerin FocusAid\'e kaydedilecek ama Google Takvim\'e yazılamayacak. Devam edilsin mi?',
      () => parcalamayiBaslat(),
      { onayEtiketi: 'Evet, devam et', yikici: false }
    );
    return;
  }
  parcalamayiBaslat();
}

async function parcalamayiBaslat() {
  const taskEl = document.getElementById('task-input');
  const descEl = document.getElementById('task-desc');
  const dlEl   = document.getElementById('task-deadline');
  const task   = taskEl?.value?.trim();
  const dl     = dlEl?.value;
  const fmt = new Date(dl).toLocaleString('tr-TR', { day:'2-digit', month:'long', year:'numeric', hour:'2-digit', minute:'2-digit' });
  addMessageToChat(`🚀 <b>Proje:</b> ${task}<br>📅 <b>Hedef:</b> ${fmt}`, 'user');
  setLoading(true);
  const profile = JSON.parse(localStorage.getItem('focusaid_profile') || '{}');
  // Bayat modu burada da ele: kullanici profil ekranina hic ugramadan Parcala'ya
  // gidebilir, o durumda loadProfileToUI'daki filtre hic calismaz.
  profile.todayMood = moodForToday(profile.todayMood, profile.todayMoodDate, bugunIstanbul());
  try {
    const reqEl = document.getElementById('task-requirements');
    const requirements = typeof parseRequirements === 'function' ? parseRequirements(reqEl?.value) : [];
    const res = await fetch(CONFIG.N8N_WEBHOOK, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ taskTitle: task, taskDescription: descEl?.value?.trim() ?? '', deadline: dl, requirements, userId: currentUser?.id, supabaseToken: AppState.supabaseToken, googleAccessToken: AppState.googleAccessToken || null, userProfile: planningProfile(profile) }) });
    if (!res.ok) throw new Error('n8n ' + res.status);
    const result = await res.json().catch(() => ({}));
    addMessageToChat(parcalamaSonucMesaji(result), 'ai');
    if (taskEl) taskEl.value = ''; if (descEl) descEl.value = ''; if (dlEl) dlEl.value = '';
    AppState.calendar?.refetchEvents();
  } catch(e) { addMessageToChat('❌ n8n bağlantısı kurulamadı. n8n açık mı?', 'error'); }
  finally { setLoading(false); }
}
// Parçalama sonucunu OLDUĞU GİBİ anlat. Eskiden burada sabit "Takvimin
// düzenlendi" yazıyordu; takvim node'u onError:continue ile geçtiği için
// takvime hiçbir şey yazılmadığında bile aynı mesaj çıkıyor, kullanıcı
// görevlerinin takvimde olduğunu sanıyordu.
// n8n'in eski sürümü bu sayaçları göndermezse takvim hakkında İDDİA
// ETMEYEN bir mesaja düşülür — yanlış bilgi vermektense az bilgi ver.
function parcalamaSonucMesaji(result) {
  const ilkAdim = result.firstStep || 'İlk mikro görevin hazır!';
  const kuyruk  = `<br><br>🎯 <b>İlk adım:</b><br>"<i>${ilkAdim}</i>"`;
  const yazilan = result.takvimeYazilan, toplam = result.toplam;
  // Plan çalışma penceresine sığmadıysa bir kısmı teslim tarihinden SONRAYA
  // düşer. Eskiden bu görevler son seansın başına üst üste yığılıyordu; artık
  // sığmama görünür ve söyleniyor. Sessizce doğru sanılan bir plan, geç kalan
  // bir plandan daha pahalı.
  const asan = result.tesliminOtesinde;
  const uyari = (typeof asan === 'number' && asan > 0)
    ? `<br><br>⚠️ Plan çalışma saatlerine sığmadı: <b>${asan} görev teslim tarihinden sonraya</b> düştü. Teslimi uzat, çalışma pencereni genişlet ya da kapsamı küçült.`
    : '';
  if (typeof yazilan !== 'number' || typeof toplam !== 'number' || toplam === 0) {
    return `✅ <b>Sis dağıtıldı!</b> Görevlerin hazır.${uyari}${kuyruk}`;
  }
  if (yazilan === 0) {
    return `⚠️ <b>Görevlerin kaydedildi ama takvime yazılamadı.</b> Google Takvim bağlantını kontrol edip tekrar dene.${uyari}${kuyruk}`;
  }
  if (yazilan < toplam) {
    return `⚠️ <b>Sis dağıtıldı</b> ama ${toplam} görevin yalnızca ${yazilan} tanesi takvime yazılabildi.${uyari}${kuyruk}`;
  }
  return `✅ <b>Sis dağıtıldı!</b> Takvimin düzenlendi.${uyari}${kuyruk}`;
}

function addMessageToChat(text, type = 'ai') {
  const box = document.getElementById('chat-box');
  if (!box) return;
  const cls = { user:'user-bubble ml-auto', ai:'ai-bubble shadow-md', error:'bg-red-50 text-red-700 mx-auto border border-red-200 rounded-2xl p-4 text-sm' };
  const div = document.createElement('div');
  div.className = `message-pop max-w-[85%] ${cls[type] || cls.ai}`;
  div.innerHTML = text;
  const loading = document.getElementById('loading-text');
  loading ? box.insertBefore(div, loading) : box.appendChild(div);
  box.scrollTo({ top: box.scrollHeight, behavior: 'smooth' });
}

let _loadingStageTimer = null;
const LOADING_STAGES = [
  '🌫️ Sis dağıtılıyor ve görev analiz ediliyor...',
  '🧠 Bilişsel yük & dopamin dengesi hesaplanıyor...',
  '⚡ Mikro odak seansları dilimleniyor...',
  '🚀 Seanslar takvimine en verimli saatlere yerleştiriliyor...'
];

function setLoading(v) {
  const el = document.getElementById('loading-text');
  const span = document.getElementById('loading-stage-text');
  if (!el) return;
  if (_loadingStageTimer) { clearInterval(_loadingStageTimer); _loadingStageTimer = null; }
  el.classList.toggle('hidden', !v);
  if (v && span) {
    let idx = 0;
    span.textContent = LOADING_STAGES[0];
    _loadingStageTimer = setInterval(() => {
      idx = (idx + 1) % LOADING_STAGES.length;
      span.style.opacity = '0';
      span.style.transform = 'translateY(4px)';
      setTimeout(() => {
        span.textContent = LOADING_STAGES[idx];
        span.style.opacity = '1';
        span.style.transform = 'translateY(0)';
      }, 200);
    }, 2200);
  }
}

// ── SAYFA YÜKLEYİCİ — fetch YOK, <template> kullanıyor ──
function loadPage(name) {
  const main = document.getElementById('main-content');
  if (!main) return;
  if (typeof stopTodayTimer === 'function') stopTodayTimer();
  const tpl = document.getElementById(`tpl-${name}`);
  if (!tpl) { main.innerHTML = `<p class="p-8 text-red-500">Şablon bulunamadı: ${name}</p>`; return; }

  main.innerHTML = '';
  main.appendChild(tpl.content.cloneNode(true));

  const inits = {
    today:     () => typeof initToday          === 'function' && initToday(),
    calendar:  () => typeof initCalendar       === 'function' && initCalendar(),
    profile:   () => typeof loadProfileToUI    === 'function' && loadProfileToUI(),
    projects:  () => typeof loadProjectsList   === 'function' && loadProjectsList(),
    'dehb-info': () => typeof restoreDehbSection === 'function' && restoreDehbSection()
  };
  inits[name]?.();

  // Sidebar aktif durumu
  document.querySelectorAll('.sidebar-item').forEach(b => b.classList.remove('active-link','bg-indigo-50','text-indigo-600','shadow-sm'));
  document.getElementById(`nav-${name}`)?.classList.add('active-link','bg-indigo-50','text-indigo-600','shadow-sm');

  // Enter desteği (chatbot)
  if (name === 'chatbot') {
    document.getElementById('task-input')?.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendTaskToN8N(); } });
    if (typeof bindIntake === 'function') bindIntake();
  }

  main.classList.remove('animate-slide-in');
  void main.offsetWidth;
  main.classList.add('animate-slide-in');
}

// ── TOAST ──
function showToast(msg, type = 'success') {
  document.getElementById('focusaid-toast')?.remove();
  const c = { success:'bg-emerald-600', error:'bg-red-600', info:'bg-indigo-600' };
  const t = document.createElement('div');
  t.id = 'focusaid-toast';
  t.className = `fixed bottom-6 right-6 z-50 ${c[type]||c.info} text-white px-6 py-3 rounded-2xl shadow-xl font-semibold text-sm animate-slide-in`;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

// DEFAULT_PROFILE, mergeProfile, planningProfile vb. profile-logic.js'ten gelir.
// Buradaki kod yalnizca DOM okur/yazar; hesap ve donusum orada, testleriyle.
let userProfile = mergeProfile(DEFAULT_PROFILE, JSON.parse(localStorage.getItem('focusaid_profile') || '{}'));

/* Kaydedilmemis degisiklik takibi. Kaydet butonu sayfanin en altinda ve
   profil uzun; DEHB'de "degistirdim ama kaydetmeyi unuttum" en olasi kayip.
   Herhangi bir alan degisince yapiskan bir serit cikar ve kaydete kadar durur. */
let profilKirli = false;
function profiliKirlet() {
  profilKirli = true;
  document.getElementById('profile-dirty-bar')?.classList.add('gorunur');
}
function profiliTemizle() {
  profilKirli = false;
  document.getElementById('profile-dirty-bar')?.classList.remove('gorunur');
}

/* Europe/Istanbul yerel tarihi, 'YYYY-MM-DD'. Uygulamanin geri kalani da bu
   saat dilimini kullaniyor (n8n zamanlayicisindaki IST sabiti). `en-CA` yerel
   ayari tam olarak YYYY-MM-DD uretir. Saat dilimi bilgisi bilincli olarak
   burada durur; profile-logic.js saf kalsin. */
function bugunIstanbul() {
  return new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/Istanbul' }).format(new Date());
}

function setMood(mood, kullaniciTikladi = true) {
  userProfile.todayMood = mood;
  // Mod yalnizca secildigi gun gecerlidir; tarihi olmayan mod bayat sayilir
  // (bkz. moodForToday). Yukleme sirasinda (kullaniciTikladi=false) tarihe
  // DOKUNMA -- yoksa bayat bir mod her acilista bugune tasinirdi.
  if (kullaniciTikladi) {
    userProfile.todayMoodDate = bugunIstanbul();
    profiliKirlet();
  }
  document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('mood-' + mood)?.classList.add('active');
}

/* ── Süper güçler (JSONB `superpowers`) ── */
function toggleSuperpowerUI(id) {
  userProfile.superpowers = toggleSuperpower(userProfile.superpowers, id);
  cizSuperpowerRozetleri();
  profiliKirlet();
}

function cizSuperpowerRozetleri() {
  const kap = document.getElementById('superpower-chips');
  if (!kap) return;
  const secili = normalizeSuperpowers(userProfile.superpowers);
  kap.innerHTML = SUPERPOWERS.map(s =>
    `<button type="button" class="power-chip${secili.includes(s.id) ? ' active' : ''}"
             aria-pressed="${secili.includes(s.id)}"
             onclick="toggleSuperpowerUI('${s.id}')">${s.emoji} ${s.label}</button>`
  ).join('');
}

function tamamlanmaCubuguGuncelle(profil) {
  const yuzde = profileCompleteness(profil);
  const cubuk = document.getElementById('profile-progress-bar');
  const yazi  = document.getElementById('profile-progress-text');
  if (cubuk) cubuk.style.width = yuzde + '%';
  if (yazi)  yazi.textContent  = `%${yuzde} tamamlandı`;
}

async function saveProfile() {
  const btn = document.getElementById('save-profile-btn');
  const orig = btn?.innerHTML;
  try {
    const sg = (id) => { const el = document.getElementById(id); return el ? el.value : undefined; };
    const sayi = (id) => { const v = sg(id); return v === undefined ? undefined : Number(v); };

    // Formdan YAMA uretilir, profil sifirdan KURULMAZ. Eskiden burada nesne
    // bastan yaziliyordu ve formda karsiligi olmayan her alan (lightSensitivity
    // dahil) her kaydet'te siliniyordu — birlestirmeyi mergeProfile yapar.
    userProfile = mergeProfile(userProfile, {
      focusPeriod:      sayi('focus-period'),
      workHours:        { start: sg('work-start'), end: sg('work-end') },
      social:           sg('social-mode'),
      focusTrigger:     sg('focus-trigger'),
      motivationNote:   sg('motivation-note'),
      mainObstacle:     sg('main-obstacle'),
      breakStyle:       sg('break-style'),
      hyperfocusLimit:  sg('hyperfocus-limit')
      // todayMood ve superpowers form alani degil; setMood/toggleSuperpowerUI
      // zaten userProfile'a yaziyor, merge onlari korur.
    });

    if (btn) { btn.disabled = true; btn.innerHTML = '⏳ Kaydediliyor...'; }
    localStorage.setItem('focusaid_profile', JSON.stringify(userProfile));
    // Supabase'e de kaydet. Yerel kayit zaten yapildi; ag hatasi olsa bile
    // kullanicinin girdisi kaybolmaz, ama BASARILI demeyiz.
    await saveProfileToSupabase(userProfile);
    profiliTemizle();
    tamamlanmaCubuguGuncelle(userProfile);
    if (btn) {
      btn.innerHTML = '✅ Profil Güncellendi!';
      btn.style.background = 'linear-gradient(135deg,#059669,#047857)';
      setTimeout(() => { btn.innerHTML = orig; btn.style.background = ''; btn.disabled = false; }, 2500);
    }
  } catch(e) {
    console.error('[Profil] kaydedilemedi:', e);
    // Sunucuya yazilamadi ama tarayicida duruyor — kullaniciya dogrusunu soyle.
    showToast('⚠️ Sunucuya kaydedilemedi, bu cihazda saklandı. Bağlantını kontrol et.', 'error');
    if (btn) { btn.innerHTML = orig; btn.disabled = false; }
  }
}

function loadProfileToUI() {
  if (!document.getElementById('focus-period')) return;
  const ss = (id, v) => { if (v == null) return; const el = document.getElementById(id); if (el) el.value = v; };
  ss('focus-period', userProfile.focusPeriod);
  const fd = document.getElementById('focus-display');
  if (fd) fd.textContent = (userProfile.focusPeriod || 25) + ' dk';
  ss('work-start', userProfile.workHours?.start); ss('work-end', userProfile.workHours?.end);
  ss('social-mode', userProfile.social); ss('focus-trigger', userProfile.focusTrigger);
  ss('break-style', userProfile.breakStyle); ss('motivation-note', userProfile.motivationNote);
  ss('main-obstacle', userProfile.mainObstacle); ss('hyperfocus-limit', userProfile.hyperfocusLimit);
  cizSuperpowerRozetleri();
  // Bayat modu ele: dunden kalma "Beyin Sisi" bugunku plani kucultmemeli.
  const taze = moodForToday(userProfile.todayMood, userProfile.todayMoodDate, bugunIstanbul());
  const bayatti = taze !== userProfile.todayMood;
  userProfile.todayMood = taze;
  // Bayat deger degistiyse localStorage'a da yaz -- yoksa Parcala ekrana hic
  // ugramadan cagrilirsa bayat mod hala orada bekliyor olurdu. Kullanici bir
  // sey degistirmedi, bu yuzden profiliKirlet() cagrilmaz.
  if (bayatti) localStorage.setItem('focusaid_profile', JSON.stringify(userProfile));
  if (taze) setMood(taze, false);
  else document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('active'));
  tamamlanmaCubuguGuncelle(userProfile);
  profiliTemizle();
  // Sablon her loadPage'de yeniden basiliyor; dinleyici de her seferinde
  // yeniden baglanir, birikme olmaz.
  document.getElementById('tpl-profile-root')?.addEventListener('change', profiliKirlet);
  document.getElementById('tpl-profile-root')?.addEventListener('input', profiliKirlet);
}

// ── TEMA (Açık/Koyu) ──────────────────────────────────────────────────────
function applyTheme(dark) {
  document.documentElement.classList.toggle('dark', dark);
  try { localStorage.setItem('focusaid_theme', dark ? 'dark' : 'light'); } catch (e) {}
  syncThemeToggleUI();
}

function syncThemeToggleUI() {
  const btn = document.getElementById('theme-toggle-btn');
  if (btn) btn.setAttribute('aria-pressed', document.documentElement.classList.contains('dark') ? 'true' : 'false');
}

function toggleTheme() {
  const dark = !document.documentElement.classList.contains('dark');
  applyTheme(dark);
  // Tema tercihini profile de yaz (kalici alan burasi) — böylece tercih hesaba
  // bağlı kalıcı olur, başka bir cihaz/tarayıcıda ilk girişte varsayılan bunu önerir.
  userProfile = mergeProfile(userProfile, { lightSensitivity: lightSensitivityForTheme(dark) });
  localStorage.setItem('focusaid_profile', JSON.stringify(userProfile));
  if (currentUser) saveProfileToSupabase(userProfile).catch(e => console.warn('[Tema] profil kaydedilemedi:', e.message));
}

// ── BAŞLAT ──
document.addEventListener('DOMContentLoaded', () => {
  console.log('🚀 FocusAid başlatılıyor...');
  syncThemeToggleUI();
  if (typeof syncSoundToggleUI === 'function') syncSoundToggleUI();
  if ('Notification' in window && Notification.permission === 'default') {
    // Nazikçe bildirim izni iste
    Notification.requestPermission().catch(() => {});
  }
  loadPage('today');
  // Hiperfokus izleyicisi UYGULAMA seviyesinde: loadPage() sayfa degistirirken
  // stopTodayTimer() cagiriyor, bu sayac ona takilmamali.
  if (typeof startHyperfocusWatch === 'function') startHyperfocusWatch();
});
</script>
