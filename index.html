// Tema ilk boyamadan ÖNCE uygulanır (flash-of-wrong-theme önlenir).
// Öncelik: bu tarayıcıda daha önce seçilmiş açık tercih (localStorage) →
// yoksa profildeki ışık hassasiyeti (bkz. loadProfileFromSupabase) → yoksa açık tema.
(function () {
  try {
    if (localStorage.getItem('focusaid_theme') === 'dark') document.documentElement.classList.add('dark');
  } catch (e) {}
})();
</script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap');
:root{--indigo-main:#6366f1;--indigo-glow:rgba(99,102,241,0.15);--mint-success:#10b981;--slate-bg:#f8fafc;--glass-white:rgba(255,255,255,0.85);--border-light:rgba(226,232,240,0.8);--text-main:#1e293b;--text-soft:#64748b;--sidebar-bg:#ffffff;--sidebar-border:#f1f5f9;--input-bg:#ffffff;--input-border:#e2e8f0;--card-hover-bg:#f8fafc}
/* Koyu tema — Profil'deki "Işık Hassasiyeti" tercihinden veya sidebar'daki
   ☀️/🌙 anahtarından geliyor (bkz. applyTheme/toggleTheme). Renk değerleri
   kullanıcının onayladığı koyu referans tasarımdaki oklch paletiyle birebir. */
html.dark{--indigo-main:#818cf8;--indigo-glow:rgba(129,140,248,0.25);--mint-success:#34d399;--slate-bg:oklch(0.155 0.026 262);--glass-white:oklch(0.2 0.025 262 / 0.92);--border-light:oklch(1 0 0 / 0.08);--text-main:oklch(0.95 0.01 262);--text-soft:oklch(0.62 0.02 262);--sidebar-bg:oklch(0.18 0.026 262);--sidebar-border:oklch(1 0 0 / 0.06);--input-bg:oklch(0.22 0.025 262);--input-border:oklch(1 0 0 / 0.14);--card-hover-bg:oklch(0.24 0.025 262)}
body{background:radial-gradient(at 0% 0%,rgba(99,102,241,.08) 0px,transparent 45%),radial-gradient(at 100% 0%,rgba(16,185,129,.04) 0px,transparent 40%),var(--slate-bg);font-family:'Plus Jakarta Sans',sans-serif;color:var(--text-main);min-height:100vh;letter-spacing:-.01em;transition:background .3s ease,color .3s ease}
.glass-card{background:var(--glass-white);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--border-light);border-radius:2.5rem;box-shadow:0 20px 50px -12px rgba(0,0,0,.05);transition:all .4s cubic-bezier(.34,1.56,.64,1)}
.glass-card:focus-within{transform:scale(1.01);border-color:var(--indigo-main);box-shadow:0 30px 60px -12px var(--indigo-glow)}
#chat-box{background:rgba(241,245,249,.4);border-radius:2rem;padding:1.5rem}
html.dark #chat-box{background:oklch(0.2 0.025 262 / 0.5)}
.ai-bubble{background:linear-gradient(135deg,#6366f1 0%,#4f46e5 100%);color:#fff;padding:1.25rem 1.5rem;border-radius:1.8rem 1.8rem 1.8rem .4rem;font-weight:500;box-shadow:0 10px 20px rgba(79,70,229,.2)}
.user-bubble{background:var(--input-bg);color:var(--text-main);padding:1rem 1.25rem;border-radius:1.8rem 1.8rem .4rem 1.8rem;border:1px solid var(--border-light);box-shadow:0 4px 6px -1px rgba(0,0,0,.02)}
input[type=text],input[type=number],input[type=time],input[type=date],input[type=datetime-local],textarea,select{background:var(--input-bg)!important;color:var(--text-main)!important;border:2px solid var(--input-border)!important;border-radius:1.25rem!important;padding:1rem 1.25rem!important;transition:all .2s ease;font-weight:500;font-family:'Plus Jakarta Sans',sans-serif}
input:focus,textarea:focus,select:focus{border-color:var(--indigo-main)!important;box-shadow:0 0 0 4px var(--indigo-glow)!important;outline:none!important}
input[type=checkbox],input[type=radio]{accent-color:var(--indigo-main)}
.sidebar-item.active-link{background:#eef2ff!important;color:#4f46e5!important;font-weight:700;box-shadow:0 2px 8px rgba(99,102,241,.12)}
html.dark .sidebar-item.active-link{background:oklch(0.62 0.19 292 / 0.18)!important;color:oklch(0.8 0.1 292)!important}
.theme-toggle{width:44px;height:26px;border-radius:999px;background:var(--input-border);position:relative;cursor:pointer;transition:background .2s ease;border:none;flex-shrink:0}
.theme-toggle::after{content:'';position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
html.dark .theme-toggle{background:var(--indigo-main)}
html.dark .theme-toggle::after{transform:translateX(18px)}
/* Sidebar'ın sabit Tailwind gri tonlarını tema değişkenlerine bağlar — Tailwind
   utility class'ları CSS değişkeni kullanmadığı için özel olarak override edilir. */
aside{background:var(--sidebar-bg)!important;border-color:var(--sidebar-border)!important;transition:background .3s ease,border-color .3s ease}
aside .text-slate-400{color:var(--text-soft)!important}
aside .text-slate-600{color:var(--text-main)!important}
aside .bg-slate-50{background:var(--card-hover-bg)!important}
aside .border-slate-200{border-color:var(--input-border)!important}
.sidebar-item:hover{background:var(--card-hover-bg)!important}
/* ── Uygulama genelinde koyu tema ──────────────────────────────────────────
   Kod boyunca renk paleti CSS değişkeni yerine doğrudan Tailwind'in slate-*
   sınıflarıyla yazılmış (bg-white, text-slate-900 vb.), yani gerçek "design
   token" bu gri skala. Onu burada merkezi olarak override etmek, her sayfa
   şablonunu (Bugün/Takvim/Parçalayıcı/Profil/DEHB Bilgisi) tek tek dark:
   sınıflarıyla yeniden yazmadan tüm uygulamayı koyu temaya taşıyor. */
html.dark [class*="bg-white"]{background:var(--glass-white)!important}
html.dark .text-slate-900,html.dark .text-slate-800{color:var(--text-main)!important}
html.dark .text-slate-700,html.dark .text-slate-600{color:var(--text-soft)!important}
html.dark .text-slate-500,html.dark .text-slate-400,html.dark .text-slate-300{color:oklch(0.52 0.02 262)!important}
html.dark .bg-slate-50,html.dark .bg-slate-100{background:var(--card-hover-bg)!important}
html.dark .bg-slate-200{background:var(--input-border)!important}
html.dark .border-slate-100,html.dark .border-slate-200{border-color:var(--border-light)!important}
html.dark .hover\:bg-slate-50:hover,html.dark .hover\:bg-slate-200:hover{background:var(--card-hover-bg)!important}
/* Pastel rozet arka planları (bg-indigo-100 vb.) koyu zeminde ışıklı kutu gibi
   durur — referans tasarımdaki gibi düşük opaklı renkli rozete çeviriliyor. */
html.dark [class*="bg-indigo-100"]{background:oklch(0.62 0.19 292 / 0.18)!important}
html.dark [class*="bg-rose-100"]{background:oklch(0.65 0.18 25 / 0.18)!important}
html.dark [class*="bg-amber-100"]{background:oklch(0.75 0.16 70 / 0.18)!important}
html.dark [class*="bg-sky-100"]{background:oklch(0.65 0.15 230 / 0.18)!important}
html.dark [class*="bg-violet-100"]{background:oklch(0.62 0.19 292 / 0.18)!important}
html.dark [class*="bg-emerald-100"]{background:oklch(0.72 0.15 150 / 0.18)!important}
html.dark [class*="bg-orange-100"]{background:oklch(0.75 0.16 70 / 0.18)!important}
html.dark [class*="bg-teal-100"]{background:oklch(0.7 0.13 190 / 0.18)!important}
/* DEHB Bilgisi'ndeki bg-*-50 vurgu/uyarı kutuları (Yaygınlık istatistikleri,
   "Anahtar Bulgusu", "Önemli Not" vb.) aynı mantıkla koyu temaya taşınıyor. */
html.dark [class*="bg-indigo-50"],html.dark [class*="bg-gradient-to-r"]{background:oklch(0.62 0.19 292 / 0.12)!important}
html.dark [class*="bg-emerald-50"]{background:oklch(0.72 0.15 150 / 0.12)!important}
html.dark [class*="bg-yellow-50"]{background:oklch(0.75 0.16 70 / 0.12)!important}
html.dark [class*="border-indigo-200"]{border-color:oklch(0.62 0.19 292 / 0.3)!important}
html.dark [class*="border-yellow-200"]{border-color:oklch(0.75 0.16 70 / 0.3)!important}
html.dark [class*="text-indigo-900"],html.dark [class*="text-indigo-700"]{color:oklch(0.78 0.14 292)!important}
html.dark [class*="text-emerald-900"],html.dark [class*="text-emerald-700"]{color:oklch(0.75 0.15 150)!important}
/* Slider'ın altında kalan (kartlara ait olmayan) özet/uyarı kutuları için
   üstten boşluk — slider'a yapışık durup görsel karışıklık yaratmasın. */
.dehb-slider + div, .dehb-slider + p { margin-top: 1.25rem; }
.message-pop{animation:msg-appear .3s cubic-bezier(.34,1.56,.64,1)}
.animate-slide-in{animation:reveal .6s cubic-bezier(.19,1,.22,1)}
@keyframes reveal{0%{opacity:0;transform:translateY(16px)}100%{opacity:1;transform:translateY(0)}}
@keyframes msg-appear{0%{opacity:0;transform:translateY(8px) scale(.97)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes success-bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:99px}::-webkit-scrollbar-thumb:hover{background:#94a3b8}
#focusaid-toast{max-width:360px;word-break:break-word}
.fc{font-family:'Plus Jakarta Sans',sans-serif!important;border:none!important}
.fc-toolbar-title{font-size:1.5rem!important;font-weight:800!important;color:var(--text-main)}
/* Aktif/pasif görünüm butonları (month/week) önceden hep aynı indigo renkle
   boyanıyordu — hangi görünümün seçili olduğu hiç belli olmuyordu, "bozuk"
   hissi büyük ölçüde buradan geliyordu. Şimdi sadece .fc-button-active olan
   (gerçekten seçili view) indigo, diğerleri nötr. */
.fc-button-primary{background-color:var(--input-bg)!important;color:var(--text-main)!important;border:1px solid var(--input-border)!important;border-radius:12px!important;padding:8px 16px!important;font-weight:700!important}
.fc-button-primary:hover{background-color:var(--card-hover-bg)!important}
.fc-button-primary.fc-button-active{background-color:var(--indigo-main)!important;color:#fff!important;border-color:transparent!important}
.fc-button-primary.fc-button-active:hover{background-color:#4f46e5!important}
.fc-daygrid-day.fc-day-today{background-color:var(--indigo-glow)!important}
.fc-col-header-cell{padding:12px 0!important;text-transform:uppercase;font-size:.7rem;letter-spacing:.1em;color:var(--text-soft)}
.fc-daygrid-day-number{font-weight:600;color:var(--text-soft);padding:10px!important}
.fc-event{cursor:pointer;border-radius:8px!important;padding:4px 6px!important;font-size:0.8rem!important;line-height:1.3!important;overflow:visible!important}
.fc-event-title{display:block!important;font-weight:600!important;padding:0 2px!important;white-space:normal!important}
/* Ay görünümü: hücre başına en fazla 2 görev önizlemesi (kısa, tek satır) —
   gerisi "+N daha" linkine gizleniyor, ona veya güne tıklayınca tüm görevler
   openDayView modalinde açılıyor. Önceki tam-boy kutulardan çok daha kısa
   hücreler ama tamamen soyut nokta da değil — küçük bir önizleme. */
.fc-daygrid-day-frame{min-height:78px!important}
.fc-daygrid-day-number{padding:6px 8px!important;font-size:.8rem!important}
.fc-daygrid-day-events{padding:0 3px 3px!important;min-height:0!important}
.fc-daygrid-event-harness{margin:0 0 2px!important}
.fc-daygrid-event{font-size:.68rem!important;padding:1px 5px!important;line-height:1.25!important}
.fc-daygrid-event .fc-event-title{white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}
.fc-daygrid-more-link{font-size:.68rem!important;font-weight:800!important;color:var(--indigo-main)!important}
/* Hafta görünümü: metin küçük/sıkışık kalmasın diye görünür saat aralığı
   daraltılıyor (bkz. initCalendar slotMinTime/slotMaxTime) ve yazı büyütülüyor. */
/* Aynı saate denk gelen görevler dar yan yana sütunlara sıkışınca metin
   taşıp komşu göreve bulaşıyordu (overflow:visible + saat etiketi yer
   kaplıyordu). Saat etiketi kaldırıldı (dikey konum zaten saati gösteriyor),
   taşma kesinlikle engellendi, başlık dar sütunda satır satır sarılıyor. */
.fc-timegrid-event{overflow:hidden!important}
.fc-timegrid-event .fc-event-time{display:none!important}
.fc-timegrid-event .fc-event-title{font-size:.72rem!important;white-space:normal!important;word-break:break-word!important;line-height:1.25!important}
.fc-timegrid-slot{height:2.8em!important}
/* FullCalendar v6 kendi CSS değişkenleriyle temalanıyor (resmi API) — tek tek
   iç class isimleriyle uğraşmak yerine bunları override etmek daha güvenilir. */
html.dark .fc{--fc-border-color:var(--border-light);--fc-page-bg-color:transparent;--fc-neutral-bg-color:var(--card-hover-bg);--fc-list-event-hover-bg-color:var(--card-hover-bg);--fc-today-bg-color:var(--indigo-glow)}
html.dark .fc-timegrid-slot-label,html.dark .fc-timegrid-axis{color:var(--text-soft)!important}
/* ── DEHB Dostu Profil Stilleri ── */
.adhd-hero-header{background:linear-gradient(135deg,#7c3aed 0%,#4f46e5 50%,#0d9488 100%);position:relative;overflow:hidden}
.hero-blob-1{position:absolute;top:-60px;right:-60px;width:250px;height:250px;background:rgba(255,255,255,.08);border-radius:50%;pointer-events:none}
.hero-blob-2{position:absolute;bottom:-40px;left:30%;width:150px;height:150px;background:rgba(255,255,255,.05);border-radius:50%;pointer-events:none}
.adhd-badge{background:rgba(255,255,255,.2);color:#fff;font-size:.7rem;font-weight:800;padding:.25rem .75rem;border-radius:9999px;letter-spacing:.1em;text-transform:uppercase;border:1px solid rgba(255,255,255,.3)}
.adhd-card-purple{border-top:4px solid #7c3aed!important}.adhd-card-emerald{border-top:4px solid #059669!important}.adhd-card-orange{border-top:4px solid #f97316!important}
.mood-btn{display:inline-flex;align-items:center;gap:.4rem;padding:.5rem 1rem;border-radius:9999px;border:2px solid var(--input-border);background:var(--input-bg);color:var(--text-main);font-size:.8rem;font-weight:700;cursor:pointer;transition:all .2s cubic-bezier(.34,1.56,.64,1);white-space:nowrap;font-family:'Plus Jakarta Sans',sans-serif}
.mood-btn:hover{transform:translateY(-2px) scale(1.05);border-color:#7c3aed;box-shadow:0 8px 20px rgba(124,58,237,.15)}
.mood-btn.active{background:linear-gradient(135deg,#7c3aed,#6366f1);color:#fff;border-color:transparent;box-shadow:0 8px 20px rgba(124,58,237,.3)}
.adhd-slider{-webkit-appearance:none;appearance:none;height:8px;background:linear-gradient(90deg,#7c3aed,#6366f1);border-radius:9999px;outline:none;cursor:pointer;border:none!important;padding:0!important;box-shadow:none!important}
.adhd-slider::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;background:#fff;border:3px solid #7c3aed;border-radius:50%;cursor:pointer;box-shadow:0 4px 12px rgba(124,58,237,.3);transition:all .2s ease}
.adhd-slider::-webkit-slider-thumb:hover{transform:scale(1.2)}
.energy-radio-option{display:flex;align-items:center;gap:.75rem;padding:.65rem 1rem;background:var(--card-hover-bg);color:var(--text-main);border-radius:.75rem;cursor:pointer;transition:all .2s ease;font-size:.875rem;font-weight:500}
.energy-radio-option:hover{filter:brightness(1.08);transform:translateX(4px)}
.save-btn{box-shadow:0 20px 40px -12px rgba(124,58,237,.4)}.save-btn:hover{box-shadow:0 25px 50px -12px rgba(124,58,237,.5)}
/* ── DEHB Bilgilendirme Platform Stilleri ── */

.dehb-nav-item {
  display: flex;
  align-items: center;
  gap: .7rem;
  width: 100%;
  text-align: left;
  padding: .6rem .75rem;
  border-radius: 0.9rem;
  transition: all 0.2s cubic-bezier(.34,1.56,.64,1);
  color: var(--text-soft);
  font-weight: 500;
  border: 1px solid transparent;
  cursor: pointer;
  background: transparent;
}

.dehb-nav-item:hover {
  background-color: var(--card-hover-bg);
  transform: translateX(4px);
}

/* Her bölümün kendi rengi butonun inline --nav-accent'inden geliyor (bkz.
   markup) — tek bir CSS kuralı 5 farklı rengi color-mix() ile üretiyor. */
.dehb-nav-icon {
  width: 34px; height: 34px; border-radius: .7rem; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: 1.05rem;
  background: color-mix(in srgb, var(--nav-accent) 15%, transparent);
  transition: all .2s ease;
}

.dehb-nav-item.active-link {
  background: color-mix(in srgb, var(--nav-accent) 12%, transparent) !important;
  color: var(--nav-accent) !important;
  font-weight: 700;
  border-color: color-mix(in srgb, var(--nav-accent) 30%, transparent);
  box-shadow: 0 2px 8px rgba(0,0,0,.06);
}
.dehb-nav-item.active-link .dehb-nav-icon {
  background: var(--nav-accent);
  color: #fff;
}

.dehb-content {
  display: block;
  animation: fadeInUp 0.3s ease-in-out;
}

.dehb-content.hidden {
  display: none;
}

/* Slider: her bölümdeki .glass-card'lar tek seferde tek kart olarak gösterilir
   — DEHB'de "tek ekranda çok yazı" kaydırma yorgunluğunu azaltır, akordeondan
   daha aktif bir "bir sonrakine geç" etkileşimi verir (bkz. dehb-info.js). */
.dehb-slider-viewport { overflow: hidden; border-radius: 1.5rem; transition: height .3s ease; }
.dehb-slider-track { display: flex; transition: transform .35s cubic-bezier(.65,0,.35,1); align-items: flex-start; }
.dehb-slide { flex: 0 0 100%; min-width: 0; }
.dehb-slider-nav { display: flex; align-items: center; justify-content: center; gap: 1rem; margin-top: 1rem; }
.dehb-slider-btn {
  width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
  background: var(--glass-white); border: 1px solid var(--border-light); color: var(--text-main);
  font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: all .15s ease;
  display: flex; align-items: center; justify-content: center;
}
.dehb-slider-btn:hover { background: var(--indigo-main); color: #fff; border-color: transparent; transform: scale(1.08); }
.dehb-slider-dots { display: flex; align-items: center; gap: .4rem; }
.dehb-slider-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--input-border); border: none; cursor: pointer; padding: 0; transition: all .2s ease; }
.dehb-slider-dot.active { width: 22px; border-radius: 4px; background: var(--indigo-main); }
.dehb-slider-counter { font-size: .75rem; font-weight: 800; color: var(--text-soft); letter-spacing: .05em; min-width: 2.5rem; text-align: center; }

@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Responsive: Mobile'da mini nav-bar yatay olması (sonra yapılacak) */
@media (max-width: 768px) {
  /* TODO: Mini nav-bar horizontal tab'a dönüşsün */
}

<body class="bg-slate-50 text-slate-800">

<!-- Genel Evet/Hayır Onay Modalı — tüm sayfalarda kullanılabilsin diye
     template'lerin DIŞINDA, body seviyesinde her zaman DOM'da duruyor. -->
<div id="confirm-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden z-[60] flex items-center justify-center p-4">
  <div class="bg-white rounded-3xl shadow-2xl max-w-sm w-full p-8 text-center animate-slide-in">
    <div class="text-5xl mb-4">⚠️</div>
    <h3 id="confirm-modal-title" class="text-xl font-extrabold text-slate-900 mb-2">Emin misin?</h3>
    <p id="confirm-modal-msg" class="text-slate-500 text-sm mb-8"></p>
    <div class="flex gap-3">
      <button id="confirm-modal-hayir" class="flex-1 bg-slate-100 text-slate-700 py-3 rounded-xl font-bold hover:bg-slate-200 transition-all">Hayır</button>
      <button id="confirm-modal-evet" class="flex-1 bg-red-600 text-white py-3 rounded-xl font-bold hover:bg-red-700 transition-all">Evet, Sil</button>
    </div>
  </div>

<script>
// ── SUPABASE ─────────────────────────────────────────────────────────────────
// Supabase Dashboard → Project Settings → API'den al
const SUPABASE_URL      = FOCUSAID_CONFIG.SUPABASE_URL;
const SUPABASE_ANON_KEY = FOCUSAID_CONFIG.SUPABASE_ANON_KEY;
// Tek client: aynı sayfada iki ayrı createClient() çağrısı (biri burada, biri
// <head>'de window.supabaseClient) aynı localStorage anahtarını paylaşıp
// Supabase'in "Multiple GoTrueClient instances" durumuna düşüyordu — token
// yenileme yarışı, sayfa yenilenince oturumun düşmesine yol açıyordu.
const sb = window.supabaseClient;

// ── AUTH GUARD ─────────────────────────────────────────────────────────────────
// getSession() ile anlık kontrol yerine INITIAL_SESSION event'ini bekliyoruz.
// INITIAL_SESSION, PKCE code exchange dahil tüm async işlemler tamamlandıktan
// sonra ateşlenir → redirect döngüsünü engeller.
let currentUser = null;
let _authReady = false;

const AUTH_YONLENDIRME_BAYRAGI = 'focusaid_auth_yonlendirme';

// Yalnızca yönlendirme döngüsü tespit edildiğinde gösterilir. Normalde oturumsuz
// kullanıcı sessizce auth.html'e gider.
function gosterOturumTeshisi() {
  const u = new URL(window.location.href);
  const sbAnahtarlari = Object.keys(localStorage).filter(k => k.startsWith('sb-'));
  // En sık sebep: dosyaya çift tıklayıp file:// ile açmak. localStorage origin
  // başına tutulduğundan localhost:3000'de kurulan oturum file:// altında
  // görünmez ve Google file:// adresine geri dönemez.
  const yanlisProtokol = window.location.protocol !== 'http:' && window.location.protocol !== 'https:';
  document.body.innerHTML =
    '<div style="padding:32px;font-family:ui-monospace,monospace;font-size:13px;line-height:1.7;color:#1e293b">' +
    '<h2 style="font-size:20px;font-weight:800;margin-bottom:16px">Oturum kurulamadı — teşhis</h2>' +
    (yanlisProtokol
      ? '<p style="background:#fef3c7;border-left:4px solid #f59e0b;padding:12px;margin-bottom:16px">' +
        '<b>Sebep bu:</b> sayfa <code>' + window.location.protocol + '</code> ile açılmış. ' +
        'Sunucuyu başlatıp (<code>python serve.py</code>) ' +
        '<a href="http://localhost:3000/auth.html" style="color:#4f46e5;font-weight:700">http://localhost:3000/auth.html</a> ' +
        'adresinden açın.</p>'
      : '') +
    '<b>URL:</b> ' + window.location.href + '<br>' +
    '<b>code parametresi:</b> ' + (u.searchParams.get('code') ? 'VAR' : 'YOK') + '<br>' +
    '<b>error:</b> ' + (u.searchParams.get('error') || u.searchParams.get('error_description') || 'yok') + '<br>' +
    '<b>hash:</b> ' + (window.location.hash || 'yok') + '<br>' +
    '<b>localStorage sb- anahtarları:</b> ' + (sbAnahtarlari.length ? sbAnahtarlari.join(', ') : 'HİÇ YOK') + '<br><br>' +
    '<a href="auth.html" style="color:#4f46e5;font-weight:700">← Giriş sayfasına dön</a></div>';
}

async function _onSession(session) {
  currentUser = session.user;
  showUserInfo(currentUser);
  if (session.access_token)  AppState.supabaseToken = session.access_token;
  // NOT: session.provider_token'ı takvime bağlamak İÇİN KULLANMA — Supabase'in Google
  // OAuth'unda calendar.events scope'u bilerek yok, bu token'la events.list 403 verir.
  // Takvim izni SADECE "Google Takvimi Bağla" butonundaki GIS tokenClient'tan gelir.
  await loadProfileFromSupabase();
  // DOMContentLoaded, INITIAL_SESSION'dan önce ateşlenebilir; o durumda Bugün
  // ekranı currentUser yokken yüklenip boş kalır. Yalnızca hiç yüklenememişse
  // tekrar dene — aksi halde gereksiz ikinci sorgu atılır.
  if (typeof initToday === 'function' && document.getElementById('today-list') && !TodayState.loaded) {
    await initToday();
  }
}

sb.auth.onAuthStateChange(async (event, session) => {
  // Teşhis: giriş döngüsünde hangi olayın geldiğini ve oturumun kurulup
  // kurulmadığını görmek için. URL'de code/error var mı da yazdırılır.
  console.log('[Auth]', event, session ? 'oturum VAR' : 'oturum YOK',
              '| url:', window.location.href);
  if (event === 'SIGNED_OUT') {
    window.location.href = 'auth.html';
    return;
  }
  if (event === 'INITIAL_SESSION') {
    _authReady = true;
    if (!session) {
      // Oturum yok → giriş sayfasına. Bayrak, auth.html ↔ index.html arasında
      // sonsuz yönlendirme döngüsü oluşursa ikinci turda durup sebebi ekrana
      // yazmak için; döngüye giren bir sayfayı tarayıcıda incelemek zordur.
      if (sessionStorage.getItem(AUTH_YONLENDIRME_BAYRAGI)) {
        sessionStorage.removeItem(AUTH_YONLENDIRME_BAYRAGI);
        gosterOturumTeshisi();
        return;
      }
      sessionStorage.setItem(AUTH_YONLENDIRME_BAYRAGI, '1');
      window.location.href = 'auth.html';
      return;
    }
    sessionStorage.removeItem(AUTH_YONLENDIRME_BAYRAGI);
    await _onSession(session);
    return;
  }
  if ((event === 'SIGNED_IN' || event === 'TOKEN_REFRESHED') && session) {
    if (!_authReady) { _authReady = true; await _onSession(session); return; }
    currentUser = session.user;
    if (session.access_token) AppState.supabaseToken = session.access_token;
  }
});

function showUserInfo(user) {
  const meta = user.user_metadata || {};
  const infoEl   = document.getElementById('user-info');
  const avatarEl = document.getElementById('user-avatar');
  const nameEl   = document.getElementById('user-name');
  const emailEl  = document.getElementById('user-email');
  if (!infoEl) return;
  infoEl.classList.remove('hidden');
  if (avatarEl) avatarEl.src = meta.avatar_url || '';
  if (nameEl)   nameEl.textContent  = (meta.full_name || user.email || '').split(' ')[0];
  if (emailEl)  emailEl.textContent = user.email || '';
}

async function signOut() {
  localStorage.removeItem(GOOGLE_TOKEN_STORAGE_KEY);
  await sb.auth.signOut();
  window.location.href = 'auth.html';
}

// ── PROJELERİM SAYFASI ────────────────────────────────────────────────────────
// n8n bir görevi parçaladığında ürettiği her mikro-görev satırı aynı
// project_title'ı taşır (bkz. n8n-workflow-focusaid.json → projectTitle:
// merged.taskTitle) — o yüzden "günü temizle" değil "projeyi sil" doğru birim:
// tek bir günü silmek zinciri kırıp diğer günlerdeki parçalarını yetim bırakır.
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Genel Evet/Hayır onay modalı — native confirm() tarayıcı akışını kilitlediği
// ve göze çarpmadığı için tercih edilmedi.
function showConfirm(title, message, onConfirm) {
  const modal = document.getElementById('confirm-modal');
  // Onay modalı DOM'da yoksa YIKICI işlemi sessizce çalıştırma — güvenli
  // taraf, iptal etmek. (Daha önce bu modal bir sayfa şablonunun içine hapsolup
  // başka sayfalarda hiç render olmamıştı; onaysız silme buradan kaynaklanmıştı.)
  if (!modal) { console.error('[Onay] confirm-modal DOM\'da yok, işlem iptal edildi:', title); showToast('❌ Onay penceresi açılamadı, işlem iptal edildi.', 'error'); return; }
  document.getElementById('confirm-modal-title').textContent = title;
  document.getElementById('confirm-modal-msg').textContent = message;
  modal.classList.remove('hidden');
  const evetBtn = document.getElementById('confirm-modal-evet');
  const hayirBtn = document.getElementById('confirm-modal-hayir');
  const cleanup = () => { modal.classList.add('hidden'); evetBtn.onclick = null; hayirBtn.onclick = null; };
  evetBtn.onclick = () => { cleanup(); onConfirm(); };
  hayirBtn.onclick = cleanup;
}

// Her projeye sabit bir renk teması: EduAdmin referansındaki kategoriye-özel
// renkli ilerleme çubuğu + SMART referansındaki renkli ikon rozeti fikrinin
// birleşimi. İsme göre değil sıraya göre atanıyor (basit, deterministik).
const PROJE_TEMALARI = [
  { icon: '🚀', bg: 'bg-indigo-100',  text: 'text-indigo-600',  bar: 'bg-indigo-500'  },
  { icon: '🎯', bg: 'bg-rose-100',    text: 'text-rose-600',    bar: 'bg-rose-500'    },
  { icon: '📚', bg: 'bg-amber-100',   text: 'text-amber-600',   bar: 'bg-amber-500'   },
  { icon: '🛠️', bg: 'bg-sky-100',     text: 'text-sky-600',     bar: 'bg-sky-500'     },
  { icon: '🧠', bg: 'bg-violet-100',  text: 'text-violet-600',  bar: 'bg-violet-500'  },
  { icon: '✨', bg: 'bg-emerald-100', text: 'text-emerald-600', bar: 'bg-emerald-500' },
  { icon: '🔥', bg: 'bg-orange-100',  text: 'text-orange-600',  bar: 'bg-orange-500'  },
  { icon: '🌱', bg: 'bg-teal-100',    text: 'text-teal-600',    bar: 'bg-teal-500'    }
];

async function loadProjectsList() {
  const grid = document.getElementById('projects-grid');
  const empty = document.getElementById('projects-empty');
  const stats = document.getElementById('projects-stats');
  if (!grid || !currentUser) return;
  try {
    const { data, error } = await window.supabaseClient
      .from('tasks')
      .select('project_title, day, completed')
      .eq('user_id', currentUser.id)
      .not('project_title', 'is', null);
    if (error) throw error;

    const groups = {};
    for (const t of (data || [])) {
      const key = (t.project_title || '').trim();
      if (!key) continue;
      if (!groups[key]) groups[key] = { total: 0, done: 0, days: new Set() };
      groups[key].total++;
      if (t.completed) groups[key].done++;
      if (t.day) groups[key].days.add(t.day);
    }
    const names = Object.keys(groups).sort();
    if (names.length === 0) {
      grid.innerHTML = '';
      grid.classList.add('hidden');
      stats?.classList.add('hidden');
      empty?.classList.remove('hidden');
      return;
    }
    grid.classList.remove('hidden');
    empty?.classList.add('hidden');

    // Özet istatistik satırı (SMART referansı): toplam proje/görev/tamamlanan
    // + saf CSS conic-gradient ile dairesel genel ilerleme (CuteHR referansı).
    if (stats) {
      const toplamGorev = names.reduce((s, n) => s + groups[n].total, 0);
      const toplamTamam = names.reduce((s, n) => s + groups[n].done, 0);
      const genelYuzde = toplamGorev > 0 ? Math.round((toplamTamam / toplamGorev) * 100) : 0;
      stats.classList.remove('hidden');
      stats.innerHTML = `
        <div class="glass-card p-5 bg-white/90 shadow-lg flex items-center gap-4">
          <div class="w-12 h-12 rounded-2xl bg-indigo-100 text-indigo-600 flex items-center justify-center text-2xl shrink-0">📁</div>
          <div class="min-w-0"><p class="text-2xl font-extrabold text-slate-900 tabular-nums">${names.length}</p><p class="text-xs font-bold text-slate-400 uppercase tracking-wide">Proje</p></div>
        </div>
        <div class="glass-card p-5 bg-white/90 shadow-lg flex items-center gap-4">
          <div class="w-12 h-12 rounded-2xl bg-sky-100 text-sky-600 flex items-center justify-center text-2xl shrink-0">🧩</div>
          <div class="min-w-0"><p class="text-2xl font-extrabold text-slate-900 tabular-nums">${toplamGorev}</p><p class="text-xs font-bold text-slate-400 uppercase tracking-wide">Görev</p></div>
        </div>
        <div class="glass-card p-5 bg-white/90 shadow-lg flex items-center gap-4">
          <div class="w-12 h-12 rounded-2xl bg-emerald-100 text-emerald-600 flex items-center justify-center text-2xl shrink-0">✅</div>

        </div>

        </div>`;
    }

    grid.innerHTML = names.map((name, i) => {
      const g = groups[name];
      const days = [...g.days].sort();
      const aralik = days.length ? (days[0] === days[days.length - 1] ? days[0] : `${days[0]} → ${days[days.length - 1]}`) : '';
      const yuzde = g.total > 0 ? Math.round((g.done / g.total) * 100) : 0;
      const tema = PROJE_TEMALARI[i % PROJE_TEMALARI.length];
      return `
        <div class="glass-card p-6 bg-white/90 shadow-lg hover:shadow-xl transition-all">
          <div class="flex items-start justify-between mb-4">
            <div class="w-12 h-12 rounded-2xl ${tema.bg} ${tema.text} flex items-center justify-center text-2xl">${tema.icon}</div>
            <button data-proje="${escapeHtml(name)}" onclick="projeSilTiklandi(this)" class="text-slate-300 hover:text-red-500 transition-colors text-lg leading-none" title="Projeyi sil">🗑️</button>
          </div>
          <h3 class="font-bold text-slate-900 text-lg mb-1 truncate" title="${escapeHtml(name)}">${escapeHtml(name)}</h3>
          <p class="text-xs text-slate-400 mb-4">${escapeHtml(aralik)}</p>
          <div class="flex justify-between items-center text-xs font-bold text-slate-500 mb-1.5">
            <span>İlerleme</span><span class="${tema.text} tabular-nums">${g.done}/${g.total}</span>
          </div>
          <div class="h-2 bg-slate-200 rounded-full overflow-hidden">
            <div class="h-full ${tema.bar} rounded-full transition-all duration-500" style="width:${yuzde}%"></div>
          </div>
        </div>`;
    }).join('');
  } catch (e) {
    console.error('[Projeler] yüklenemedi:', e);
    grid.innerHTML = '<div class="text-red-400 py-10 col-span-full text-center">❌ Projeler yüklenemedi</div>';
  }
}

function projeSilTiklandi(btn) {
  const proje = btn.dataset.proje;
  if (!proje) return;
  showConfirm(
    'Projeyi sil?',
    `"${proje}" projesindeki tüm görevler (geçmiş dahil, tüm günler) kalıcı olarak silinecek. Bu işlem geri alınamaz.`,
    () => projeSilUygula(proje)
  );
}

async function projeSilUygula(proje) {
  if (!currentUser) return;
  try {
    const { data: rows, error: fetchErr } = await window.supabaseClient
      .from('tasks')
      .select('id, calendar_event_id')
      .eq('user_id', currentUser.id)
      .eq('project_title', proje);
    if (fetchErr) throw fetchErr;

    // Bağlı Google Calendar etkinliklerini de sil, yoksa Supabase satırı gitse
    // bile ham GCal etkinliği takvimde hayalet görev olarak kalır.
    if (AppState.gapiReady && AppState.googleAccessToken) {
      gapi.client.setToken({ access_token: AppState.googleAccessToken });
      for (const row of (rows || [])) {
        if (!row.calendar_event_id) continue;
        try { await gapi.client.calendar.events.delete({ calendarId: 'primary', eventId: row.calendar_event_id }); }
        catch (e) { console.warn('[Proje Sil] Takvim etkinliği silinemedi:', row.calendar_event_id, e); }
      }
    }

    const { error: delErr } = await window.supabaseClient
      .from('tasks')
      .delete()
      .eq('user_id', currentUser.id)
      .eq('project_title', proje);
    if (delErr) throw delErr;

    showToast(`🗑️ "${proje}" silindi`, 'success');
    await loadProjectsList();
    AppState.calendar?.refetchEvents();
    if (typeof TodayState !== 'undefined') TodayState.loaded = false;
    if (typeof initToday === 'function' && document.getElementById('today-list')) await initToday();
  } catch (e) {
    console.error('[Proje Sil] hata:', e);
    showToast('❌ Silinemedi: ' + (e.message || 'bilinmeyen hata'), 'error');
    await loadProjectsList();
  }
}

// ── CONFIG ──
const CONFIG = FOCUSAID_CONFIG;

const AppState = { calendar: null, tokenClient: null, gapiReady: false, gisReady: false, googleAccessToken: null, supabaseToken: null };
const GOOGLE_TOKEN_STORAGE_KEY = 'focusaid_google_token';

// ── GOOGLE AUTH ──
function gapiLoaded() {
  gapi.load('client', async () => {
    try {
      await gapi.client.init({ apiKey: CONFIG.GOOGLE_API_KEY, discoveryDocs: [CONFIG.DISCOVERY_DOC] });
      AppState.gapiReady = true;
    } catch(e) { console.error('Google API hatası:', e); }
  });
}
function gisLoaded() {
  AppState.tokenClient = google.accounts.oauth2.initTokenClient({ client_id: CONFIG.GOOGLE_CLIENT_ID, scope: CONFIG.SCOPES, callback: '' });
  AppState.gisReady = true;
  restoreGoogleToken();
}
// Sayfa yenilenince Takvim token'ının hafızadan silinip her seferinde yeniden
// "Google Takvimi Bağla" istemesini önler — token süresi (~1 saat) dolmadıysa
// localStorage'dan geri yüklenir. activateGoogleCalendar zaten gapiReady'yi
// bekliyor, o yüzden burada ek bekleme gerekmiyor.
function restoreGoogleToken() {
  try {
    const raw = localStorage.getItem(GOOGLE_TOKEN_STORAGE_KEY);
    if (!raw) return;
    const saved = JSON.parse(raw);
    if (!saved?.access_token || !saved?.expiresAt || Date.now() >= saved.expiresAt) {
      localStorage.removeItem(GOOGLE_TOKEN_STORAGE_KEY);
      return;
    }
    activateGoogleCalendar(saved.access_token);
  } catch(e) { localStorage.removeItem(GOOGLE_TOKEN_STORAGE_KEY); }
}
// Google Calendar'ı aktifleştirir: token'ı GAPI'ye set eder, butonu günceller, etkinlikleri yükler
async function activateGoogleCalendar(token) {
  AppState.googleAccessToken = token;
  let waited = 0;
  while (!AppState.gapiReady && waited < 8000) {
    await new Promise(r => setTimeout(r, 200));
    waited += 200;
  }
  if (AppState.gapiReady) {
    gapi.client.setToken({ access_token: token });
    const btn = document.getElementById('auth-btn');
    if (btn) {
      btn.textContent = '✓ Takvim Bağlandı';
      btn.classList.add('text-emerald-600', 'border-emerald-200');
      btn.disabled = true;
    }
  }
  AppState.calendar?.refetchEvents();
}

function handleAuthClick() {
  if (!AppState.gisReady) { showToast('Google henüz hazır değil, bekle.', 'error'); return; }
  AppState.tokenClient.callback = async (resp) => {
    if (resp.error) return;
    const t = gapi.client.getToken();
    if (t?.access_token) {
      const expiresAt = Date.now() + (Number(resp.expires_in || 3600) * 1000);
      localStorage.setItem(GOOGLE_TOKEN_STORAGE_KEY, JSON.stringify({ access_token: t.access_token, expiresAt }));
      await activateGoogleCalendar(t.access_token);
    }
  };
  AppState.tokenClient.requestAccessToken({ prompt: gapi.client.getToken() === null ? 'consent' : '' });
}

// ── TAKVİM ──
function initCalendar() {
  const el = document.getElementById('calendar');
  if (!el) return;
  try {
    initCalendarUnsafe(el);
  } catch (e) {
    console.error('[Takvim] initCalendar çöktü:', e);
    el.innerHTML = `<div class="p-8 text-center text-red-500">❌ Takvim yüklenemedi: ${(e?.message || e).toString().replace(/</g,'&lt;')}</div>`;
  }
}
function initCalendarUnsafe(el) {
  AppState.calendar = new FullCalendar.Calendar(el, {
    initialView: 'dayGridMonth', locale: 'tr',
    headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth,timeGridWeek' },
    height: 'auto',
    // Ay ve hafta görünümü farklı boyutlanıyor: ay hücre başına en fazla 2
    // görev önizlemesi gösterip gerisini "+N daha"ya gizliyor (bkz. moreLinkClick),
    // hafta sadece uyanık saatleri gösteriyor (00:00-24:00 tamamı sıkışık ve
    // okunaksız kalıyordu).
    views: {
      dayGridMonth: { dayMaxEvents: 2 },
      timeGridWeek: { slotMinTime: '07:00:00', slotMaxTime: '23:00:00', slotDuration: '00:30:00', expandRows: true }
    },
    aspectRatio: 1.9,
    nowIndicator: true,
    selectable: true, editable: true,
    dateClick(info) { try { openDayView(info.dateStr); } catch (e) { console.error('[Takvim] dateClick hata:', e); } },
    // "+N daha" linkine tıklayınca FullCalendar'ın kendi popover'ı yerine
    // bizim gün-detay modalimiz açılsın (tutarlılık için). NOT: moreLinkClick'in
    // argümanında dateStr YOK (dateClick'ten farklı) — info.date kullanılmalı,
    // ve toISOString() UTC verdiği için yerel tarihi bir gün kaydırabiliyordu;
    // localDayISO ile düzeltildi. Dönüş değeri FullCalendar'ın kabul ettiği
    // 'false' — daha önce kullanılan 'none' resmi API'de yok.
    moreLinkClick(info) {
      try { openDayView(localDayISO(info.date)); } catch (e) { console.error('[Takvim] moreLinkClick hata:', e); }
      return false;
    },
    eventClick(info) { try { openTaskForm(info.event.startStr.split('T')[0], info.event); } catch (e) { console.error('[Takvim] eventClick hata:', e); } },
    events: async (info, successCb, failureCb) => {
      try {
        const events = [];
        const startDate = info.startStr.split('T')[0];
        const endDate = info.endStr.split('T')[0];
        // n8n her görev için HEM Supabase satırı HEM Google Calendar etkinliği
        // oluşturuyor (calendar_event_id ile eşleşiyorlar) — ikisini de ham
        // haliyle takvime basarsak her görev iki kez görünür. Yoğun kullanıcılarda
        // (100+ görev) bu hem görsel karmaşa hem de hafta görünümünde onlarca
        // çakışan etkinliği aynı anda düzenlemeye çalışan FullCalendar için ciddi
        // bir performans/donma riski yaratıyor. Supabase'te zaten temsil edilen
        // GCal etkinliklerini burada eleyip tekilleştiriyoruz.
        const eslenmisGcalIdleri = new Set();

        // 1. Supabase'den tasks'ı çek
        try {
          const { data: tasks, error: tasksError } = await window.supabaseClient
            .from('tasks')
            .select('*')
            .eq('user_id', currentUser?.id)
            .gte('day', startDate)
            .lte('day', endDate);

          if (!tasksError && tasks) {
            events.push(...tasks.map(task => {
              if (task.calendar_event_id) eslenmisGcalIdleri.add(task.calendar_event_id);
              return {
                id: `task-${task.id}`,
                title: task.name || 'Görev',
                start: task.start_time,
                end: task.end_time,
                extendedProps: {
                  description: task.description || '',
                  cognitive_load: task.cognitive_load || 'Orta'
                },
                backgroundColor: task.completed ? '#94a3b8' : '#6366f1',
                borderColor: 'transparent'
              };
            }));
            console.log(`[Takvim] Supabase'den ${tasks.length} görev yüklendi`, tasks.slice(0,3).map(t => ({title: t.title, id: t.id, day: t.day, start_time: t.start_time})));
          }
        } catch(e) { console.warn('[Takvim] Supabase tasks yüklenemedi:', e); }

        // 2. Google Calendar'dan events'ı çek — Supabase'te zaten temsil edilenler hariç
        if (AppState.gapiReady && AppState.googleAccessToken) {
          try {
            gapi.client.setToken({ access_token: AppState.googleAccessToken });
            const resp = await gapi.client.calendar.events.list({
              calendarId: 'primary',
              timeMin: info.startStr,
              timeMax: info.endStr,
              singleEvents: true,
              orderBy: 'startTime'
            });
            if (resp.result.items) {
              const tekilGcalEtkinlikleri = resp.result.items.filter(ev => !eslenmisGcalIdleri.has(ev.id));
              events.push(...tekilGcalEtkinlikleri.map(ev => ({
                id: ev.id,
                title: ev.summary || 'Görev',
                start: ev.start?.dateTime || ev.start?.date,
                end: ev.end?.dateTime || ev.end?.date,
                extendedProps: { description: ev.description || '' },
                backgroundColor: (ev.summary || '').includes('Mola') ? '#10b981' : '#8b5cf6',
                borderColor: 'transparent'
              })));
              console.log(`[Takvim] Google Calendar'dan ${resp.result.items.length} etkinlik geldi, ${tekilGcalEtkinlikleri.length} tekil eklendi (${resp.result.items.length - tekilGcalEtkinlikleri.length} zaten Supabase'te vardı)`);
            }
          } catch(e) { console.warn('[Takvim] Google Calendar events yüklenemedi:', e); }
        }

        successCb(events);
      } catch(e) { console.error('Takvim etkinlikleri yüklenemedi:', e); failureCb(e); }
    }
  });
  AppState.calendar.render();
  // Eğer Supabase'den token zaten varsa hemen aktifleştir
  if (AppState.googleAccessToken) activateGoogleCalendar(AppState.googleAccessToken);
}

// ── GÖREV FORMU ──
function openTaskForm(date, ev = null) {
  const panel = document.getElementById('task-form-panel');
  if (!panel) return;
  const set = (id, v) => { const el = document.getElementById(id); if (el) el.value = v ?? ''; };
  const now = new Date();
  set('task-date',  date);
  set('task-title', ev?.title ?? '');
  set('task-desc',  ev?.extendedProps?.description ?? '');
  set('task-start', ev ? ev.startStr.split('T')[1]?.slice(0,5) : `${String(now.getHours()).padStart(2,'0')}:00`);
  updateEndTime();
  panel.classList.remove('hidden');
  panel.classList.add('animate-slide-in');
  document.getElementById('task-title')?.focus();
}
function closeForm() { document.getElementById('task-form-panel')?.classList.add('hidden'); }

// ── GÜN DETAYLARI MODAL ──
async function openDayView(dateStr) {
  const modal = document.getElementById('day-modal');
  const dateEl = document.getElementById('day-modal-date');
  const tasksList = document.getElementById('day-tasks-list');
  if (!modal || !dateEl || !tasksList) return;

  // Tarihi güzel format'la
  const date = new Date(dateStr + 'T00:00:00');
  const formatter = new Intl.DateTimeFormat('tr-TR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  dateEl.textContent = formatter.format(date);

  // Yükleniyor göster
  tasksList.innerHTML = '<div class="text-center text-slate-400 py-8">Görevler yükleniyor...</div>';
  modal.classList.remove('hidden');

  try {
    // Supabase'ten o günün görevlerini çek
    const { data, error } = await window.supabaseClient
      .from('tasks')
      .select('*')
      .eq('user_id', currentUser?.id)
      .eq('day', dateStr)
      .order('start_time', { ascending: true });

    if (error) throw error;

    if (!data || data.length === 0) {
      tasksList.innerHTML = '<div class="text-center text-slate-400 py-8">📭 Bu gün için görev yok</div>';
      return;
    }

    // Görevleri listele
    tasksList.innerHTML = data.map(task => {
      const start = task.start_time ? new Date(task.start_time).toLocaleTimeString('tr-TR', {hour: '2-digit', minute: '2-digit'}) : '--:--';
      const end = task.end_time ? new Date(task.end_time).toLocaleTimeString('tr-TR', {hour: '2-digit', minute: '2-digit'}) : '--:--';
      const isCompleted = task.completed === true;
      const statusColor = isCompleted ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700';
      const statusText = isCompleted ? '✓ Tamamlandı' : '⏳ Bekleniyor';

      return `
        <div class="p-5 bg-slate-50 rounded-2xl border border-slate-200 hover:border-indigo-300 hover:shadow-md transition-all">
          <div class="flex justify-between items-start gap-4 mb-3">
            <div class="flex-1">
              <h4 class="font-bold text-slate-900 text-lg">${task.name || task.title || 'Görev'}</h4>
              <p class="text-sm text-slate-600 mt-1">${task.description || ''}</p>
            </div>
            <span class="text-xs font-bold px-3 py-1.5 rounded-full whitespace-nowrap ${statusColor}">${statusText}</span>
          </div>
          <div class="flex gap-4 items-center text-sm">
            <span class="font-mono font-semibold text-indigo-600">🕐 ${start} - ${end}</span>
            ${task.cognitive_load ? `<span class="bg-purple-100 text-purple-700 px-2.5 py-1 rounded-full text-xs font-bold">Yoğunluk: ${task.cognitive_load}</span>` : ''}
          </div>
        </div>
      `;
    }).join('');
  } catch (err) {
    console.error('Görevler yüklenemedi:', err);
    console.error('User ID:', currentUser?.id, 'Date:', dateStr);
    console.error('Supabase client:', window.supabaseClient ? 'OK' : 'NULL');
    const errMsg = err?.message || err?.details || err?.error_description || err?.hint || (typeof err === 'string' ? err : 'Bilinmeyen hata');
    console.error('Error message:', errMsg);
    tasksList.innerHTML = `<div class="text-center text-red-500 py-8">❌ ${errMsg}</div>`;
  }
}

function closeDayModal(event) {
  if (event && event.target.id !== 'day-modal') return; // Sadece arka plana tıklanırsa kapat
  document.getElementById('day-modal')?.classList.add('hidden');
}

function openNewTaskForDay() {
  const dateStr = document.getElementById('day-modal-date')?.textContent;
  if (!dateStr) return;
  // Tarihi YYYY-MM-DD format'ına çevir
  const date = new Date(dateStr);
  const dateInput = date.toISOString().split('T')[0];
  closeDayModal();
  openTaskForm(dateInput);
}

function updateEndTime() {
  const s = document.getElementById('task-start')?.value;
  if (!s) return;
  const [h,m] = s.split(':').map(Number);
  const el = document.getElementById('task-end');
  if (el) el.value = `${String((h+1)%24).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}

async function saveTaskToGoogle() {

// ── n8n PARÇALAYICI (TAKVİM FORMU) ──
async function triggerN8N_Split() {
  const title = document.getElementById('task-title')?.value?.trim();
  const desc  = document.getElementById('task-desc')?.value ?? '';
  const date  = document.getElementById('task-date')?.value;
  if (!title) { showToast('Parçalamak için bir başlık girmelisin kral! ⚠️', 'error'); return; }
  const btn = document.querySelector('button[onclick="triggerN8N_Split()"]');
  const orig = btn?.innerHTML;
  if (btn) { btn.innerHTML = '⏳ Analiz Ediyor...'; btn.disabled = true; }
  const profile = JSON.parse(localStorage.getItem('focusaid_profile') || '{}');
  try {
    const res = await fetch(CONFIG.N8N_WEBHOOK, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ taskTitle: title, taskDescription: desc, targetDate: date, userProfile: profile, userId: currentUser?.id, supabaseToken: AppState.supabaseToken, googleAccessToken: AppState.googleAccessToken || null }) });
    if (res.ok) { showToast('🧩 Görev parçalandı!', 'success'); AppState.calendar?.refetchEvents(); closeForm(); }
    else throw new Error('n8n ' + res.status);
  } catch(e) { showToast('❌ n8n ulaşılamadı. Webhook açık mı?', 'error'); }
  finally { if (btn) { btn.innerHTML = orig; btn.disabled = false; } }
}

// ── n8n CHATBOT ──
async function sendTaskToN8N() {
  const taskEl = document.getElementById('task-input');
  const descEl = document.getElementById('task-desc');
  const dlEl   = document.getElementById('task-deadline');
  const task   = taskEl?.value?.trim();
  const dl     = dlEl?.value;
  if (!task || !dl) { addMessageToChat('⚠️ Bir görev adı ve teslim tarihi girmelisin kral!', 'error'); return; }
  const fmt = new Date(dl).toLocaleString('tr-TR', { day:'2-digit', month:'long', year:'numeric', hour:'2-digit', minute:'2-digit' });
  addMessageToChat(`🚀 <b>Proje:</b> ${task}<br>📅 <b>Hedef:</b> ${fmt}`, 'user');
  setLoading(true);
  const profile = JSON.parse(localStorage.getItem('focusaid_profile') || '{}');
  try {
    const reqEl = document.getElementById('task-requirements');
    const requirements = typeof parseRequirements === 'function' ? parseRequirements(reqEl?.value) : [];
    const res = await fetch(CONFIG.N8N_WEBHOOK, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ taskTitle: task, taskDescription: descEl?.value?.trim() ?? '', deadline: dl, requirements, userId: currentUser?.id, supabaseToken: AppState.supabaseToken, googleAccessToken: AppState.googleAccessToken || null, userProfile: { focusPeriod: profile.focusPeriod ?? 25, energyPeak: profile.energyPeak ?? 'morning', medication: profile.medication ?? false, workHours: profile.workHours ?? {start:'09:00',end:'18:00'}, mainObstacle: profile.mainObstacle ?? 'paralysis', breakStyle: profile.breakStyle ?? 'long-break' } }) });
    if (!res.ok) throw new Error('n8n ' + res.status);
    const result = await res.json().catch(() => ({}));
    addMessageToChat(`✅ <b>Sis dağıtıldı!</b> Takvimin düzenlendi.<br><br>🎯 <b>İlk adım:</b><br>"<i>${result.firstStep || 'İlk mikro görevin takviminde hazır!'}</i>"`, 'ai');
    if (taskEl) taskEl.value = ''; if (descEl) descEl.value = ''; if (dlEl) dlEl.value = '';
    AppState.calendar?.refetchEvents();
  } catch(e) { addMessageToChat('❌ n8n bağlantısı kurulamadı. n8n açık mı?', 'error'); }
  finally { setLoading(false); }
}
function addMessageToChat(text, type = 'ai') {
  const box = document.getElementById('chat-box');
  if (!box) return;
  const cls = { user:'user-bubble ml-auto', ai:'ai-bubble shadow-md', error:'bg-red-50 text-red-700 mx-auto border border-red-200 rounded-2xl p-4 text-sm' };
  const div = document.createElement('div');
  div.className = `message-pop max-w-[85%] animate-slide-in ${cls[type] || cls.ai}`;
  div.innerHTML = text;
  const loading = document.getElementById('loading-text');
  loading ? box.insertBefore(div, loading) : box.appendChild(div);
  box.scrollTo({ top: box.scrollHeight, behavior: 'smooth' });
}
function setLoading(v) { document.getElementById('loading-text')?.classList.toggle('hidden', !v); }

// ── SAYFA YÜKLEYİCİ — fetch YOK, <template> kullanıyor ──
function loadPage(name) {
  const main = document.getElementById('main-content');
  if (!main) return;
  if (typeof stopTodayTimer === 'function') stopTodayTimer();
  const tpl = document.getElementById(`tpl-${name}`);
  if (!tpl) { main.innerHTML = `<p class="p-8 text-red-500">Şablon bulunamadı: ${name}</p>`; return; }

  main.innerHTML = '';
  main.appendChild(tpl.content.cloneNode(true));

  const inits = {
    today:     () => typeof initToday          === 'function' && initToday(),
    calendar:  () => typeof initCalendar       === 'function' && initCalendar(),
    profile:   () => typeof loadProfileToUI    === 'function' && loadProfileToUI(),
    projects:  () => typeof loadProjectsList   === 'function' && loadProjectsList(),
    'dehb-info': () => typeof restoreDehbSection === 'function' && restoreDehbSection()
  };
  inits[name]?.();

  // Sidebar aktif durumu
  document.querySelectorAll('.sidebar-item').forEach(b => b.classList.remove('active-link','bg-indigo-50','text-indigo-600','shadow-sm'));
  document.getElementById(`nav-${name}`)?.classList.add('active-link','bg-indigo-50','text-indigo-600','shadow-sm');

  // Enter desteği (chatbot)
  if (name === 'chatbot') {
    document.getElementById('task-input')?.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendTaskToN8N(); } });
    if (typeof bindIntake === 'function') bindIntake();
  }

  main.classList.remove('animate-slide-in');
  void main.offsetWidth;
  main.classList.add('animate-slide-in');
}

// ── TOAST ──
function showToast(msg, type = 'success') {
  document.getElementById('focusaid-toast')?.remove();
  const c = { success:'bg-emerald-600', error:'bg-red-600', info:'bg-indigo-600' };
  const t = document.createElement('div');
  t.id = 'focusaid-toast';
  t.className = `fixed bottom-6 right-6 z-50 ${c[type]||c.info} text-white px-6 py-3 rounded-2xl shadow-xl font-semibold text-sm animate-slide-in`;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

// ── PROFİL ──
const DEFAULT_PROFILE = {
  medication:false, focusPeriod:25, workHours:{start:'09:00',end:'18:00'},
  social:'solo', energyPeak:'morning', focusTrigger:'silence',
  motivationNote:'', mainObstacle:'paralysis', breakStyle:'pomodoro',
  todayMood:'', hyperfocusLimit:'none',
  lightSensitivity:2, soundSensitivity:2, envPref:'minimal',
  rsdLevel:2, regulationMethod:'breathing', stimPref:'fidget',
  superpowers:[]
};
let userProfile = { ...DEFAULT_PROFILE, ...JSON.parse(localStorage.getItem('focusaid_profile') || '{}') };

function setMood(mood) {
  userProfile.todayMood = mood;
  document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('mood-' + mood)?.classList.add('active');
}

function setMed(active) {
  userProfile.medication = !!active;
  const yes = document.getElementById('med-yes'), no = document.getElementById('med-no');
  if (!yes || !no) return;
  if (active) { yes.className='flex-1 p-3 border-2 border-purple-600 rounded-xl text-xs font-bold bg-purple-600 text-white shadow-lg'; no.className='flex-1 p-3 border rounded-xl text-xs font-bold bg-slate-50 text-slate-400 opacity-60'; }
  else { yes.className='flex-1 p-3 border rounded-xl text-xs font-bold bg-slate-50 text-slate-400 opacity-60'; no.className='flex-1 p-3 border-2 border-slate-300 rounded-xl text-xs font-bold bg-slate-200 text-slate-700 shadow-inner'; }
}

async function saveProfile() {
  try {
    const sg = (id, fb) => { const el = document.getElementById(id); return el ? el.value : fb; };
    const energyEl = document.querySelector('input[name="energy-peak"]:checked');
    userProfile = {
      medication: userProfile.medication,
      focusPeriod: Number(sg('focus-period', userProfile.focusPeriod)) || 25,
      workHours: { start: sg('work-start', userProfile.workHours.start), end: sg('work-end', userProfile.workHours.end) },
      social: sg('social-mode', userProfile.social),
      energyPeak: energyEl ? energyEl.value : userProfile.energyPeak,
      focusTrigger: sg('focus-trigger', userProfile.focusTrigger),
      motivationNote: sg('motivation-note', userProfile.motivationNote),
      mainObstacle: sg('main-obstacle', userProfile.mainObstacle),
      breakStyle: sg('break-style', userProfile.breakStyle),
      todayMood: userProfile.todayMood,
      hyperfocusLimit: sg('hyperfocus-limit', userProfile.hyperfocusLimit)
    };
    localStorage.setItem('focusaid_profile', JSON.stringify(userProfile));
    // Supabase'e de kaydet
    await saveProfileToSupabase(userProfile);
    const btn = document.getElementById('save-profile-btn');
    if (btn) {
      const orig = btn.innerHTML;
      btn.disabled = true; btn.innerHTML = '✅ Profil Güncellendi!';
      btn.style.background = 'linear-gradient(135deg,#059669,#047857)';
      setTimeout(() => { btn.innerHTML = orig; btn.style.background = ''; btn.disabled = false; }, 2500);
    }
  } catch(e) { console.error(e); showToast('Kayıt hatası!','error'); }
}

function loadProfileToUI() {
  if (!document.getElementById('focus-period')) return;
  const ss = (id, v) => { if (v == null) return; const el = document.getElementById(id); if (el) el.value = v; };
  ss('focus-period', userProfile.focusPeriod);
  const fd = document.getElementById('focus-display');
  if (fd) fd.textContent = (userProfile.focusPeriod || 25) + ' dk';
  ss('work-start', userProfile.workHours?.start); ss('work-end', userProfile.workHours?.end);
  ss('social-mode', userProfile.social); ss('focus-trigger', userProfile.focusTrigger);
  ss('break-style', userProfile.breakStyle); ss('motivation-note', userProfile.motivationNote);
  ss('main-obstacle', userProfile.mainObstacle); ss('hyperfocus-limit', userProfile.hyperfocusLimit);
  const radio = document.querySelector(`input[name="energy-peak"][value="${userProfile.energyPeak}"]`);
  if (radio) radio.checked = true;
  setMed(userProfile.medication);
  if (userProfile.todayMood) setMood(userProfile.todayMood);
}

// ── TEMA (Açık/Koyu) ──────────────────────────────────────────────────────
function applyTheme(dark) {
  document.documentElement.classList.toggle('dark', dark);
  try { localStorage.setItem('focusaid_theme', dark ? 'dark' : 'light'); } catch (e) {}
  syncThemeToggleUI();
}

function syncThemeToggleUI() {
  const btn = document.getElementById('theme-toggle-btn');
  if (btn) btn.setAttribute('aria-pressed', document.documentElement.classList.contains('dark') ? 'true' : 'false');
}

function toggleTheme() {
  const dark = !document.documentElement.classList.contains('dark');
  applyTheme(dark);
  // Profildeki "Işık Hassasiyeti" alanına da yaz — böylece tercih hesaba bağlı
  // kalıcı olur, başka bir cihaz/tarayıcıda ilk girişte varsayılan bunu önerir.
  userProfile.lightSensitivity = dark ? 4 : 1;
  localStorage.setItem('focusaid_profile', JSON.stringify(userProfile));
  if (currentUser) saveProfileToSupabase(userProfile).catch(() => {});
}

// ── BAŞLAT ──
document.addEventListener('DOMContentLoaded', () => {
  console.log('🚀 FocusAid başlatılıyor...');
  syncThemeToggleUI();
  loadPage('today');
});
</script>
