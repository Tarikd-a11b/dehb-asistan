// Tema ilk boyamadan ÖNCE uygulanır (flash-of-wrong-theme önlenir).
// Öncelik: bu tarayıcıda daha önce seçilmiş açık tercih (localStorage) →
// yoksa profildeki ışık hassasiyeti (bkz. loadProfileFromSupabase) → yoksa açık tema.

    if (localStorage.getItem('focusaid_theme') === 'dark') document.documentElement.classList.add('dark');
  } catch (e) {}
})();
</script>

:root{--indigo-main:#6366f1;--indigo-glow:rgba(99,102,241,0.15);--mint-success:#10b981;--slate-bg:#f8fafc;--glass-white:rgba(255,255,255,0.85);--border-light:rgba(226,232,240,0.8);--text-main:#1e293b;--text-soft:#64748b;--sidebar-bg:#ffffff;--sidebar-border:#f1f5f9;--input-bg:#ffffff;--input-border:#e2e8f0;--card-hover-bg:#f8fafc}
/* Koyu tema — Profil'deki "Işık Hassasiyeti" tercihinden veya sidebar'daki
   ☀️/🌙 anahtarından geliyor (bkz. applyTheme/toggleTheme). Renk değerleri
   kullanıcının onayladığı koyu referans tasarımdaki oklch paletiyle birebir. */
html.dark{--indigo-main:#818cf8;--indigo-glow:rgba(129,140,248,0.25);--mint-success:#34d399;--slate-bg:oklch(0.155 0.026 262);--glass-white:oklch(0.2 0.025 262 / 0.92);--border-light:oklch(1 0 0 / 0.08);--text-main:oklch(0.95 0.01 262);--text-soft:oklch(0.62 0.02 262);--sidebar-bg:oklch(0.18 0.026 262);--sidebar-border:oklch(1 0 0 / 0.06);--input-bg:oklch(0.22 0.025 262);--input-border:oklch(1 0 0 / 0.14);--card-hover-bg:oklch(0.24 0.025 262)}
body{background:radial-gradient(at 0% 0%,rgba(99,102,241,.08) 0px,transparent 45%),radial-gradient(at 100% 0%,rgba(16,185,129,.04) 0px,transparent 40%),var(--slate-bg);font-family:'Plus Jakarta Sans',sans-serif;color:var(--text-main);min-height:100vh;letter-spacing:-.01em;transition:background .3s ease,color .3s ease}
.glass-card{background:var(--glass-white);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--border-light);border-radius:2.5rem;box-shadow:0 20px 50px -12px rgba(0,0,0,.05);transition:all .35s cubic-bezier(.34,1.56,.64,1)}
.glass-card:hover{border-color:rgba(129,140,248,0.3)}
.glass-card:focus-within{transform:scale(1.01);border-color:var(--indigo-main);box-shadow:0 30px 60px -12px var(--indigo-glow)}
#chat-box{background:rgba(241,245,249,.4);border-radius:2rem;padding:1.5rem}
html.dark #chat-box{background:oklch(0.2 0.025 262 / 0.5)}
.ai-bubble{background:linear-gradient(135deg,#6366f1 0%,#4f46e5 100%);color:#fff;padding:1.25rem 1.5rem;border-radius:1.8rem 1.8rem 1.8rem .4rem;font-weight:500;box-shadow:0 10px 20px rgba(79,70,229,.2);animation:popIn .35s cubic-bezier(.34,1.56,.64,1)}
.user-bubble{background:var(--input-bg);color:var(--text-main);padding:1rem 1.25rem;border-radius:1.8rem 1.8rem .4rem 1.8rem;border:1px solid var(--border-light);box-shadow:0 4px 6px -1px rgba(0,0,0,.02);animation:popIn .35s cubic-bezier(.34,1.56,.64,1)}
input[type=text],input[type=number],input[type=time],input[type=date],input[type=datetime-local],textarea,select{background:var(--input-bg)!important;color:var(--text-main)!important;border:2px solid var(--input-border)!important;border-radius:1.25rem!important;padding:1rem 1.25rem!important;transition:all .2s cubic-bezier(.34,1.56,.64,1);font-weight:500;font-family:'Plus Jakarta Sans',sans-serif}
input:focus,textarea:focus,select:focus{border-color:var(--indigo-main)!important;box-shadow:0 0 0 4px var(--indigo-glow)!important;outline:none!important;transform:scale(1.005)}
input[type=checkbox],input[type=radio]{accent-color:var(--indigo-main)}
.sidebar-item{transition:all .25s cubic-bezier(.34,1.56,.64,1)}
.sidebar-item:hover{background:var(--card-hover-bg)!important;transform:translateX(4px)}

.sidebar-item.active-link{background:#eef2ff!important;color:#4f46e5!important;font-weight:700;box-shadow:0 4px 14px rgba(99,102,241,.15);transform:translateX(4px)}
html.dark .sidebar-item.active-link{background:oklch(0.62 0.19 292 / 0.18)!important;color:oklch(0.8 0.1 292)!important}
.theme-toggle{width:44px;height:26px;border-radius:999px;background:var(--input-border);position:relative;cursor:pointer;transition:background .2s ease;border:none;flex-shrink:0}
.theme-toggle::after{content:'';position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
html.dark .theme-toggle{background:var(--indigo-main)}
html.dark .theme-toggle::after{transform:translateX(18px)}
/* Sidebar'ın sabit Tailwind gri tonlarını tema değişkenlerine bağlar — Tailwind
   utility class'ları CSS değişkeni kullanmadığı için özel olarak override edilir. */
aside{background:var(--sidebar-bg)!important;border-color:var(--sidebar-border)!important;transition:background .3s ease,border-color .3s ease}
aside .text-slate-400{color:var(--text-soft)!important}
aside .text-slate-600{color:var(--text-main)!important}
aside .bg-slate-50{background:var(--card-hover-bg)!important}
aside .border-slate-200{border-color:var(--input-border)!important}
.sidebar-item:hover{background:var(--card-hover-bg)!important}
/* ── Uygulama genelinde koyu tema ──────────────────────────────────────────
   Kod boyunca renk paleti CSS değişkeni yerine doğrudan Tailwind'in slate-*
   sınıflarıyla yazılmış (bg-white, text-slate-900 vb.), yani gerçek "design
   token" bu gri skala. Onu burada merkezi olarak override etmek, her sayfa
   şablonunu (Bugün/Takvim/Parçalayıcı/Profil/DEHB Bilgisi) tek tek dark:
   sınıflarıyla yeniden yazmadan tüm uygulamayı koyu temaya taşıyor. */
html.dark [class*="bg-white"]{background:var(--glass-white)!important}
html.dark .text-slate-900,html.dark .text-slate-800{color:var(--text-main)!important}
html.dark .text-slate-700,html.dark .text-slate-600{color:var(--text-soft)!important}
html.dark .text-slate-500,html.dark .text-slate-400,html.dark .text-slate-300{color:oklch(0.52 0.02 262)!important}
html.dark .bg-slate-50,html.dark .bg-slate-100{background:var(--card-hover-bg)!important}
html.dark .bg-slate-200{background:var(--input-border)!important}
html.dark .border-slate-100,html.dark .border-slate-200{border-color:var(--border-light)!important}
html.dark .hover\:bg-slate-50:hover,html.dark .hover\:bg-slate-200:hover{background:var(--card-hover-bg)!important}
/* Pastel rozet arka planları (bg-indigo-100 vb.) koyu zeminde ışıklı kutu gibi
   durur — referans tasarımdaki gibi düşük opaklı renkli rozete çeviriliyor. */
html.dark [class*="bg-indigo-100"]{background:oklch(0.62 0.19 292 / 0.18)!important}
html.dark [class*="bg-rose-100"]{background:oklch(0.65 0.18 25 / 0.18)!important}
html.dark [class*="bg-amber-100"]{background:oklch(0.75 0.16 70 / 0.18)!important}
html.dark [class*="bg-sky-100"]{background:oklch(0.65 0.15 230 / 0.18)!important}
html.dark [class*="bg-violet-100"]{background:oklch(0.62 0.19 292 / 0.18)!important}
html.dark [class*="bg-emerald-100"]{background:oklch(0.72 0.15 150 / 0.18)!important}
html.dark [class*="bg-orange-100"]{background:oklch(0.75 0.16 70 / 0.18)!important}
html.dark [class*="bg-teal-100"]{background:oklch(0.7 0.13 190 / 0.18)!important}
/* DEHB Bilgisi'ndeki bg-*-50 vurgu/uyarı kutuları (Yaygınlık istatistikleri,
   "Anahtar Bulgusu", "Önemli Not" vb.) aynı mantıkla koyu temaya taşınıyor. */
html.dark [class*="bg-indigo-50"],html.dark [class*="bg-gradient-to-r"]{background:oklch(0.62 0.19 292 / 0.12)!important}
html.dark [class*="bg-emerald-50"]{background:oklch(0.72 0.15 150 / 0.12)!important}
html.dark [class*="bg-yellow-50"]{background:oklch(0.75 0.16 70 / 0.12)!important}
html.dark [class*="border-indigo-200"]{border-color:oklch(0.62 0.19 292 / 0.3)!important}
html.dark [class*="border-yellow-200"]{border-color:oklch(0.75 0.16 70 / 0.3)!important}
html.dark [class*="text-indigo-900"],html.dark [class*="text-indigo-700"]{color:oklch(0.78 0.14 292)!important}
html.dark [class*="text-emerald-900"],html.dark [class*="text-emerald-700"]{color:oklch(0.75 0.15 150)!important}
.message-pop{animation:msg-appear .3s cubic-bezier(.34,1.56,.64,1)}
.animate-slide-in{animation:reveal .6s cubic-bezier(.19,1,.22,1)}
@keyframes reveal{0%{opacity:0;transform:translateY(16px)}100%{opacity:1;transform:translateY(0)}}
@keyframes msg-appear{0%{opacity:0;transform:translateY(8px) scale(.97)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes success-bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:99px}::-webkit-scrollbar-thumb:hover{background:#94a3b8}
#focusaid-toast{max-width:360px;word-break:break-word}
.fc{font-family:'Plus Jakarta Sans',sans-serif!important;border:none!important}
.fc-toolbar-title{font-size:1.5rem!important;font-weight:800!important;color:var(--text-main)}
/* Aktif/pasif görünüm butonları (month/week) önceden hep aynı indigo renkle
   boyanıyordu — hangi görünümün seçili olduğu hiç belli olmuyordu, "bozuk"
   hissi büyük ölçüde buradan geliyordu. Şimdi sadece .fc-button-active olan
   (gerçekten seçili view) indigo, diğerleri nötr. */
.fc-button-primary{background-color:var(--input-bg)!important;color:var(--text-main)!important;border:1px solid var(--input-border)!important;border-radius:12px!important;padding:8px 16px!important;font-weight:700!important}
.fc-button-primary:hover{background-color:var(--card-hover-bg)!important}
.fc-button-primary.fc-button-active{background-color:var(--indigo-main)!important;color:#fff!important;border-color:transparent!important}
.fc-button-primary.fc-button-active:hover{background-color:#4f46e5!important}
.fc-daygrid-day.fc-day-today{background-color:var(--indigo-glow)!important}
.fc-col-header-cell{padding:12px 0!important;text-transform:uppercase;font-size:.7rem;letter-spacing:.1em;color:var(--text-soft)}
.fc-daygrid-day-number{font-weight:600;color:var(--text-soft);padding:10px!important}
.fc-event{cursor:pointer;border-radius:14px!important;padding:6px 8px!important;font-size:0.8rem!important;line-height:1.3!important;overflow:visible!important;box-shadow:0 2px 6px rgba(15,23,42,.06)}
.fc-event-title{display:block!important;font-weight:700!important;padding:0 2px!important;white-space:normal!important}
/* Ay görünümü: hücre başına en fazla 2 görev önizlemesi (kısa, tek satır) —
   gerisi "+N daha" linkine gizleniyor, ona veya güne tıklayınca tüm görevler
   openDayView modalinde açılıyor. Önceki tam-boy kutulardan çok daha kısa
   hücreler ama tamamen soyut nokta da değil — küçük bir önizleme. */
.fc-daygrid-day-frame{min-height:78px!important}
/* 78px AY hücreleri için. Hafta görünümündeki tüm-gün şeridi de aynı daygrid
   yapısını kullanıyor, kural oraya SIZIYOR: içi bomboş bir şerit 78px yer
   kaplıyor (ölçüldü) ve 700px'lik kutuda kaydırma taşmasını 132px'ten 214px'e
   çıkarıyordu. Şerit içeriği kadar olsun. */
.fc-timegrid .fc-daygrid-day-frame{min-height:0!important}
/* Şeridin sol etiketi ("Tüm gün") dar eksen sütununda İKİ satıra sarıp şeridi
   48px'e çıkarıyordu (ölçüldü: cushion 48px, satır yüksekliği 24px). Küçük punto
   + tek satır: şerit artık içeriği kadar yer kaplıyor. */
.fc-timegrid-axis-cushion{font-size:.62rem!important;line-height:1.2!important;white-space:nowrap!important;padding:2px 4px!important}
.fc-daygrid-day-number{padding:6px 8px!important;font-size:.8rem!important}
.fc-daygrid-day-events{padding:0 3px 3px!important;min-height:0!important}
.fc-daygrid-event-harness{margin:0 0 2px!important}
.fc-daygrid-event{font-size:.68rem!important;padding:1px 5px!important;line-height:1.25!important}
.fc-daygrid-event .fc-event-title{white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}
.fc-daygrid-more-link{font-size:.68rem!important;font-weight:800!important;color:var(--indigo-main)!important}
/* Hafta görünümü: metin küçük/sıkışık kalmasın diye görünür saat aralığı
   daraltılıyor (bkz. initCalendar slotMinTime/slotMaxTime) ve yazı büyütülüyor. */
/* Aynı saate denk gelen görevler dar yan yana sütunlara sıkışınca metin
   taşıp komşu göreve bulaşıyordu (overflow:visible + saat etiketi yer
   kaplıyordu). Saat etiketi kaldırıldı (dikey konum zaten saati gösteriyor),
   taşma kesinlikle engellendi, başlık dar sütunda satır satır sarılıyor. */
/* .fc-event'in 6px dikey padding'i hafta görünümünde felaket: 25 dakikalık bir
   görev kartı 18px, bunun 12px'ini padding yiyor. Ay görünümünde rahat duruyor,
   o yüzden yalnızca timegrid'de daraltılıyor. */
.fc-timegrid-event{overflow:hidden!important;padding:1px 6px!important}
/* Kart içeriği artık eventContent ile kod tarafından üretiliyor (bkz.
   initCalendarUnsafe): saat yalnızca ≥45dk'lık kartlarda basılıyor, bu yüzden
   CSS'in saat etiketini gizlemesine/zorlamasına gerek kalmadı. */
.fc-ozel-kart{min-width:0}
/* opacity YOK: .85 alfa beyaz yaziyi 3.71-4.43:1'e dusuruyordu, yani kart
   renklerini WCAG AA icin koyulastirmak bosa gidiyordu. Saat yazisi zaten
   daha kucuk punto ile ikincil duruyor, ayrica soluklastirmaya gerek yok. */
.fc-ozel-saat{font-size:.62rem;font-weight:700;line-height:1.15}
/* Satır sayısı sabit değil: eventContent kartı süreye göre --satir ile ayarlıyor.
   Sabit line-clamp:3 kart yüksekliğine duyarsızdı, kısa görevlerde başlığı
   satır ortasından kesiyordu. line-clamp:1 tek satırı "..." ile kırpar. */
.fc-ozel-baslik{font-size:.72rem;font-weight:700;line-height:1.2;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:var(--satir,1);-webkit-box-orient:vertical;word-break:break-word}
/* Çok kısa görevlerde (30dk altı) tek satır bile taşıyordu; yazı biraz küçülüyor. */
.fc-ozel-kart--mini .fc-ozel-baslik{font-size:.62rem;line-height:1.1}
/* 30dk altı kartlarda kenarlık + dikey padding SIFIR (sınıfı eventClassNames veriyor).
   1px üst + 1px alt kenarlık ve 1px+1px padding, ~15px'lik bir kartın 4px'ini
   yiyip başlık satırının altını kırpıyordu. Kenarlık kartın kendi rengiyle aynı
   olduğu için kaldırılması görünümü değiştirmiyor, yalnızca yer açıyor. */
.fc-timegrid-event.fc-olay-kisa{border-width:0!important;padding:0 6px!important}
/* Satır yüksekliği: 16 saat × 2.8em ≈ 717px. ~700px'lik kutuda (bkz. datesSet)
   başlık satırı düşülünce ~70-100px'lik hafif bir taşma kalıyor — kartların
   okunaklı kalması için kabul edilen bilinçli denge. Değiştirirsen Step 8'deki
   ölçümü tekrar çalıştır. */
.fc-timegrid-slot{height:2.8em!important}
/* FullCalendar v6 kendi CSS değişkenleriyle temalanıyor (resmi API) — tek tek
   iç class isimleriyle uğraşmak yerine bunları override etmek daha güvenilir. */
html.dark .fc{--fc-border-color:var(--border-light);--fc-page-bg-color:transparent;--fc-neutral-bg-color:var(--card-hover-bg);--fc-list-event-hover-bg-color:var(--card-hover-bg);--fc-today-bg-color:var(--indigo-glow)}
html.dark .fc-timegrid-slot-label,html.dark .fc-timegrid-axis{color:var(--text-soft)!important}
/* ── DEHB Dostu Profil Stilleri ── */
.adhd-hero-header{background:linear-gradient(135deg,#7c3aed 0%,#4f46e5 50%,#0d9488 100%);position:relative;overflow:hidden}
.hero-blob-1{position:absolute;top:-60px;right:-60px;width:250px;height:250px;background:rgba(255,255,255,.08);border-radius:50%;pointer-events:none}
.hero-blob-2{position:absolute;bottom:-40px;left:30%;width:150px;height:150px;background:rgba(255,255,255,.05);border-radius:50%;pointer-events:none}
.adhd-badge{background:rgba(255,255,255,.2);color:#fff;font-size:.7rem;font-weight:800;padding:.25rem .75rem;border-radius:9999px;letter-spacing:.1em;text-transform:uppercase;border:1px solid rgba(255,255,255,.3)}
.adhd-card-purple{border-top:4px solid #7c3aed!important}.adhd-card-emerald{border-top:4px solid #059669!important}.adhd-card-orange{border-top:4px solid #f97316!important}
.adhd-card-amber{border-top:4px solid #d97706!important}
/* Profil doluluk cubugu (hero icinde, koyu zemin uzerinde). */
.profile-progress-track{height:8px;border-radius:9999px;background:rgba(255,255,255,.2);overflow:hidden}
.profile-progress-fill{height:100%;border-radius:9999px;background:linear-gradient(90deg,#a5f3fc,#fff);transition:width .5s cubic-bezier(.34,1.56,.64,1)}
/* Super guc rozetleri — mood-btn ile ayni etkilesim dili, farkli renk. */
.power-chip{display:inline-flex;align-items:center;gap:.35rem;padding:.5rem 1rem;border-radius:9999px;border:2px solid var(--input-border);background:var(--input-bg);color:var(--text-main);font-size:.8rem;font-weight:700;cursor:pointer;transition:all .2s cubic-bezier(.34,1.56,.64,1);font-family:'Plus Jakarta Sans',sans-serif}
.power-chip:hover{transform:translateY(-2px);border-color:#d97706;box-shadow:0 8px 20px rgba(217,119,6,.15)}
.power-chip.active{background:linear-gradient(135deg,#d97706,#f59e0b);color:#fff;border-color:transparent;box-shadow:0 8px 20px rgba(217,119,6,.3)}
/* Firefox thumb'i ayri bir pseudo-element istiyor; olmadan kaydirici orada
   tarayicinin varsayilan gorunumunde kaliyordu. */

<script>
// ── SUPABASE ─────────────────────────────────────────────────────────────────
// Supabase Dashboard → Project Settings → API'den al
const SUPABASE_URL      = FOCUSAID_CONFIG.SUPABASE_URL;
const SUPABASE_ANON_KEY = FOCUSAID_CONFIG.SUPABASE_ANON_KEY;
// Tek client: aynı sayfada iki ayrı createClient() çağrısı (biri burada, biri
// <head>'de window.supabaseClient) aynı localStorage anahtarını paylaşıp
// Supabase'in "Multiple GoTrueClient instances" durumuna düşüyordu — token
// yenileme yarışı, sayfa yenilenince oturumun düşmesine yol açıyordu.
const sb = window.supabaseClient;

// ── AUTH GUARD ─────────────────────────────────────────────────────────────────
// getSession() ile anlık kontrol yerine INITIAL_SESSION event'ini bekliyoruz.
// INITIAL_SESSION, PKCE code exchange dahil tüm async işlemler tamamlandıktan
// sonra ateşlenir → redirect döngüsünü engeller.
let currentUser = null;
let _authReady = false;

const AUTH_YONLENDIRME_BAYRAGI = 'focusaid_auth_yonlendirme';

// Yalnızca yönlendirme döngüsü tespit edildiğinde gösterilir. Normalde oturumsuz
// kullanıcı sessizce auth.html'e gider.
function gosterOturumTeshisi() {
  const u = new URL(window.location.href);
  const sbAnahtarlari = Object.keys(localStorage).filter(k => k.startsWith('sb-'));
  // En sık sebep: dosyaya çift tıklayıp file:// ile açmak. localStorage origin
  // başına tutulduğundan localhost:3000'de kurulan oturum file:// altında
  // görünmez ve Google file:// adresine geri dönemez.
  const yanlisProtokol = window.location.protocol !== 'http:' && window.location.protocol !== 'https:';
  document.body.innerHTML =
    '<div style="padding:32px;font-family:ui-monospace,monospace;font-size:13px;line-height:1.7;color:#1e293b">' +
    '<h2 style="font-size:20px;font-weight:800;margin-bottom:16px">Oturum kurulamadı — teşhis</h2>' +
    (yanlisProtokol
      ? '<p style="background:#fef3c7;border-left:4px solid #f59e0b;padding:12px;margin-bottom:16px">' +
        '<b>Sebep bu:</b> sayfa <code>' + window.location.protocol + '</code> ile açılmış. ' +
        'Sunucuyu başlatıp (<code>python serve.py</code>) ' +
        '<a href="http://localhost:3000/auth.html" style="color:#4f46e5;font-weight:700">http://localhost:3000/auth.html</a> ' +
        'adresinden açın.</p>'
      : '') +
    '<b>URL:</b> ' + window.location.href + '<br>' +
    '<b>code parametresi:</b> ' + (u.searchParams.get('code') ? 'VAR' : 'YOK') + '<br>' +
    '<b>error:</b> ' + (u.searchParams.get('error') || u.searchParams.get('error_description') || 'yok') + '<br>' +
    '<b>hash:</b> ' + (window.location.hash || 'yok') + '<br>' +
    '<b>localStorage sb- anahtarları:</b> ' + (sbAnahtarlari.length ? sbAnahtarlari.join(', ') : 'HİÇ YOK') + '<br><br>' +
    '<a href="auth.html" style="color:#4f46e5;font-weight:700">← Giriş sayfasına dön</a></div>';
}

async function _onSession(session) {
  currentUser = session.user;
  showUserInfo(currentUser);
  if (session.access_token)  AppState.supabaseToken = session.access_token;
  // Giriş artık takvim iznini de istiyor (bkz. auth.html'deki `scopes`), o yüzden
  // Supabase oturumundaki provider_token doğrudan Google API token'ı oluyor:
  // kullanıcı ayrıca "Google Takvimi Bağla"ya basmak zorunda kalmıyor.
  // ESKİ NOT (artık geçersiz): "provider_token'ı KULLANMA, scope yok, 403 verir."
  // Yine de körlemesine güvenmiyoruz — kullanıcı izni reddetmiş olabilir, o yüzden
  // token'ın takvime gerçekten yettiği ÖLÇÜLÜP öyle bağlanıyor (bkz. tokenTakvimeYetiyorMu).
  if (session.provider_token) {
    baglaOturumTokeniyle(session.provider_token).finally(() => otoBaglanmaBitti('oturum'));
  } else {
    otoBaglanmaBitti('oturum');
  }
  // Refresh token YALNIZCA giriş anında, o da izin ekranı gösterildiyse geliyor
  // (bkz. auth.html'deki access_type=offline + prompt=consent). Kaçırılırsa bir
  // daha ele geçmez, o yüzden hemen profile yazılıyor.
  if (session.provider_refresh_token) saklaYenilemeTokeni(session.provider_refresh_token);
  await loadProfileFromSupabase();
  // DOMContentLoaded, INITIAL_SESSION'dan önce ateşlenebilir; o durumda Bugün
  // ekranı currentUser yokken yüklenip boş kalır. Yalnızca hiç yüklenememişse
  // tekrar dene — aksi halde gereksiz ikinci sorgu atılır.
  if (typeof initToday === 'function' && document.getElementById('today-list') && !TodayState.loaded) {
    await initToday();
  }
}

sb.auth.onAuthStateChange(async (event, session) => {
  // Teşhis: giriş döngüsünde hangi olayın geldiğini ve oturumun kurulup
  // kurulmadığını görmek için. URL'de code/error var mı da yazdırılır.
  console.log('[Auth]', event, session ? 'oturum VAR' : 'oturum YOK',
              '| url:', window.location.href);
  if (event === 'SIGNED_OUT') {
    window.location.href = 'auth.html';
    return;
  }
  if (event === 'INITIAL_SESSION') {
    _authReady = true;
    if (!session) {
      // Oturum yok → giriş sayfasına. Bayrak, auth.html ↔ index.html arasında
      // sonsuz yönlendirme döngüsü oluşursa ikinci turda durup sebebi ekrana
      // yazmak için; döngüye giren bir sayfayı tarayıcıda incelemek zordur.
      if (sessionStorage.getItem(AUTH_YONLENDIRME_BAYRAGI)) {
        sessionStorage.removeItem(AUTH_YONLENDIRME_BAYRAGI);
        gosterOturumTeshisi();
        return;
      }
      sessionStorage.setItem(AUTH_YONLENDIRME_BAYRAGI, '1');
      window.location.href = 'auth.html';
      return;
    }
    sessionStorage.removeItem(AUTH_YONLENDIRME_BAYRAGI);
    await _onSession(session);
    return;
  }
  if ((event === 'SIGNED_IN' || event === 'TOKEN_REFRESHED') && session) {
    if (!_authReady) { _authReady = true; await _onSession(session); return; }
    currentUser = session.user;
    if (session.access_token) AppState.supabaseToken = session.access_token;
  }
});

function showUserInfo(user) {
  const meta = user.user_metadata || {};
  const infoEl   = document.getElementById('user-info');
  const avatarEl = document.getElementById('user-avatar');
  const nameEl   = document.getElementById('user-name');
  const emailEl  = document.getElementById('user-email');
  if (!infoEl) return;
  infoEl.classList.remove('hidden');
  if (avatarEl) avatarEl.src = meta.avatar_url || '';
  if (nameEl)   nameEl.textContent  = (meta.full_name || user.email || '').split(' ')[0];
  if (emailEl)  emailEl.textContent = user.email || '';
}

async function signOut() {
  localStorage.removeItem(GOOGLE_TOKEN_STORAGE_KEY);
  await sb.auth.signOut();
  window.location.href = 'auth.html';
}

// ── PROJELERİM SAYFASI ────────────────────────────────────────────────────────
// n8n bir görevi parçaladığında ürettiği her mikro-görev satırı aynı
// project_title'ı taşır (bkz. n8n-workflow-focusaid.json → projectTitle:
// merged.taskTitle) — o yüzden "günü temizle" değil "projeyi sil" doğru birim:
// tek bir günü silmek zinciri kırıp diğer günlerdeki parçalarını yetim bırakır.
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Genel Evet/Hayır onay modalı — native confirm() tarayıcı akışını kilitlediği
// ve göze çarpmadığı için tercih edilmedi.
/**
 * @param {Object} [secenekler]
 *   onayEtiketi — onay dugmesinin yazisi (varsayilan 'Evet')
 *   yikici      — true ise kirmizi + uyari ikonu, false ise indigo + soru ikonu.
 *                 Geri donusu olmayan islemi normal onaydan RENKLE ayirir.
 */
function showConfirm(title, message, onConfirm, secenekler) {
  const modal = document.getElementById('confirm-modal');
  // Onay modalı DOM'da yoksa YIKICI işlemi sessizce çalıştırma — güvenli
  // taraf, iptal etmek. (Daha önce bu modal bir sayfa şablonunun içine hapsolup
  // başka sayfalarda hiç render olmamıştı; onaysız silme buradan kaynaklanmıştı.)
  if (!modal) { console.error('[Onay] confirm-modal DOM\'da yok, işlem iptal edildi:', title); showToast('❌ Onay penceresi açılamadı, işlem iptal edildi.', 'error'); return; }
  document.getElementById('confirm-modal-title').textContent = title;
  document.getElementById('confirm-modal-msg').textContent = message;
  const o = secenekler || {};
  const yikici = o.yikici !== false;   // varsayilan: yikici (ilk cagrilar silme idi)
  const evetBtn = document.getElementById('confirm-modal-evet');
  evetBtn.textContent = o.onayEtiketi || 'Evet';
  // Iki dal da HER seferinde acikca kuruluyor: modal tek ve surekli DOM'da,
  // onceki cagrinin renk siniflari uzerinde birikmemeli.
  evetBtn.classList.remove('bg-red-600','hover:bg-red-700','bg-indigo-600','hover:bg-indigo-700');
  evetBtn.classList.add(...(yikici ? ['bg-red-600','hover:bg-red-700'] : ['bg-indigo-600','hover:bg-indigo-700']));
  const ikon = document.getElementById('confirm-modal-icon');
  if (ikon) ikon.textContent = yikici ? '⚠️' : '❓';
  modal.classList.remove('hidden');
  const hayirBtn = document.getElementById('confirm-modal-hayir');
  const cleanup = () => { modal.classList.add('hidden'); evetBtn.onclick = null; hayirBtn.onclick = null; };
  evetBtn.onclick = () => { cleanup(); onConfirm(); };
  hayirBtn.onclick = cleanup;
}

// Her projeye sabit bir renk teması: EduAdmin referansındaki kategoriye-özel
// renkli ilerleme çubuğu + SMART referansındaki renkli ikon rozeti fikrinin

  { icon: '🎯', bg: 'bg-rose-100',    text: 'text-rose-600',    bar: 'bg-rose-500'    },
