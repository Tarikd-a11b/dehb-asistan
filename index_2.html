<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>FocusAid — yönlendiriliyor…</title>
</head>
<body>
<!--
  Bu dosya artık uygulamanın kendisi DEĞİL; tek işi index.html'e yönlendirmek.

  Neden duruyor: uygulama eskiden index.html ve index_2.html olarak iki ayrı
  kopya halinde tutuluyordu ve elle eşitleniyordu (docs/superpowers/plans/*
  içindeki "ikizdir" notları). Tek kopyaya (index.html) geçildi, ama Supabase
  Dashboard → Authentication → URL Configuration → Redirect URLs listesinde
  kayıtlı adres hâlâ http://localhost:3000/index_2.html. Google girişinden
  dönüş bu adrese düştüğü için burası ayakta kalmalı.

  Kaldırmak için: Supabase'e http://localhost:3000/index.html adresini ekle,
  auth.html içindeki redirectTo'yu index.html yap, sonra bu dosyayı sil.

  Sorgu dizesi ve hash aynen taşınır — PKCE'nin ?code= parametresi de,
  implicit akışın #access_token= değeri de index.html'e ulaşmalı.
-->
<script>
  location.replace('index.html' + location.search + location.hash);
</script>
<noscript>
  <p>JavaScript kapalı. <a href="index.html">index.html</a> adresine gidin.</p>
</noscript>
</body>
</html>
